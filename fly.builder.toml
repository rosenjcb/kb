# Fly.io BUILDER for the kb chat demo — the hourly, one-shot 1GB machine.
#
# This app has NO http service. Its single job: once an hour, spawn a 1GB
# machine that rescans the base + git(s), publishes a fresh sha256-verified
# snapshot to Tigris, and rolls the serving app (kb-demo) onto it — then stops.
# Because it runs as a Fly *scheduled* machine that exits when done, the 1GB
# node only costs money for the few minutes it actually builds each hour.
#
# It shares the serving image (Dockerfile.fly) but overrides the command to the
# builder script and runs at 1GB.
#
# Setup (once):
#   fly apps create kb-demo-builder
#   fly deploy -c fly.builder.toml -a kb-demo-builder            # builds/pushes the image
#   # Give the builder access to the SAME bucket + provider key + a deploy token
#   # for the serving app so it can roll it:
#   fly storage update <tigris-id> --app kb-demo-builder         # or copy AWS_* + BUCKET_NAME secrets
#   fly secrets set -a kb-demo-builder GEMINI_API_KEY=... \
#       SERVE_APP=kb-demo \
#       FLY_API_TOKEN="$(fly tokens create deploy -a kb-demo --expiry 8760h | tail -n1)"
#   # Create the hourly, run-to-completion machine (this is the scheduler):
#   fly machine run . -c fly.builder.toml -a kb-demo-builder \
#       --schedule hourly --restart no --vm-memory 1024 \
#       bash /app/scripts/fly/refresh.sh
#
# Full model + operations: FLY_ORCHESTRATION.md

app = "kb-demo-builder"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  KB_HOME = "/data"
  KB_BASE = "demo"
  # The repo(s) to (re)index. Cold-path first run clones these; warm path pulls
  # them incrementally. Matches the serving demo's source of truth.
  KB_GIT_REPOS = "https://github.com/rosenjcb/kb#main"
  LOG_LEVEL = "info"
  # SERVE_APP, FLY_API_TOKEN, GEMINI_API_KEY, and the Tigris AWS_*/BUCKET_NAME
  # values are set as secrets (see setup above) — never hard-code them here.

# The builder is a batch job, not a service: no [http_service], no checks. The
# scheduled machine (created with `fly machine run --schedule hourly`) runs
# scripts/fly/refresh.sh to completion and stops until the next hour.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
