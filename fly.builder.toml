# Fly.io BUILDER for the kb chat demo — the daily, one-shot machine.
#
# This app has NO http service. Its single job: once a day, spawn a machine that
# rescans EVERY base in scripts/fly/bases.json + its git(s), publishes a fresh
# sha256-verified snapshot per base to Tigris, and rolls the serving app
# (kb-demo) onto them — then stops. Because it runs as a Fly *scheduled* machine
# that exits when done, it only costs money for the few minutes it actually
# builds each day.
#
# It shares the serving image (Dockerfile.fly) but overrides the command to the
# builder script. See the [[vm]] block at the bottom for the size and why.
#
# Setup from nothing: `scripts/fly/bootstrap.sh` does the whole cold standup
# (apps, bucket, secrets, image, seed, serving deploy, scheduler) in the one
# order that works. Tearing it all back down: `scripts/fly/teardown.sh`.
# Shipping an update to an existing deployment: `scripts/fly/deploy.sh`.
# Full model + operations: FLY_ORCHESTRATION.md
#
# Every `fly machine run` against this app must pass the region, [[vm]] size,
# and [env] table explicitly, because `fly machine run -c` reads NONE of them
# from this file. Do not hand-copy them — `scripts/fly/builder-args.mjs` parses
# them out of this file for every caller:
#
#   fly machine run . -c fly.builder.toml -a kb-demo-builder \
#       --schedule daily --restart no \
#       $(node scripts/fly/builder-args.mjs | tr '\n' ' ') \
#       bash /app/scripts/fly/refresh.sh

app = "kb-demo-builder"
# Keep builder + serving + Tigris traffic in one region (see fly.toml note).
# Honored by `fly deploy -c`, but NOT by `fly machine run -c` — and the
# builder's only machine is created by `fly machine run`, so every such call
# passes --region from scripts/fly/builder-args.mjs, which also hard-fails if
# this value and fly.toml's primary_region ever disagree.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  KB_HOME = "/data"
  KB_SERVER_BASE_NAME = "kb"
  # Gemini avoids the OOM Local ONNX causes on large cold builds (see [[vm]]'s
  # note below) — must match fly.toml's KB_EMBEDDER so builder and serving
  # share a backend and query vectors match stored model_id rows.
  KB_EMBEDDER = "gemini"
  # Which bases to build is driven by scripts/fly/bases.json (the golden default
  # `demo` = this repo, plus one base per eval suite repo). Each base's cold build
  # clones its own repo; there is no single KB_SERVER_BASE_GIT_REPOS anymore.
  # Ship tiny serve-only snapshots (drop working trees) so the 256MB serving node
  # can hold ~10 bases; per-base source links still resolve from snapshot manifest
  # provenance. Set to "false" to carry full working trees.
  SNAPSHOT_NO_REPOS = "true"
  LOG_LEVEL = "info"
  # Default (1800s/30min) was too tight for the biggest cold builds (brew,
  # kestra, lazygit's huge docs corpus, and this repo itself) — they missed
  # the window while smaller repos in the same run finished fine. Bumped once
  # empirically confirmed against the largest repos in bases.json.
  COLD_BUILD_TIMEOUT = "5400"
  # SERVE_APP, FLY_API_TOKEN, GEMINI_API_KEY, and the Tigris AWS_*/BUCKET_NAME
  # values are set as secrets (see setup above) — never hard-code them here.

# The builder is a batch job, not a service: no [http_service], no checks. The
# scheduled machine (created with `fly machine run --schedule daily`) runs
# scripts/fly/refresh.sh to completion and stops until the next day.
#
# SIZING — right-sized down from performance-4x/8192mb (2026-11-26).
# The 8GB tier dated from before the builder's two memory sinks were fixed:
#   * `embedAllFacts` allocated one array for every fact up front; it now
#     paginates (packages/kb-core/src/core/INIT.md § Regression benchmark —
#     1,000,000 facts → peak RSS 163.7 MiB), and
#   * the default Local ONNX embedder loaded ~207 MiB of model weights on its
#     first call; KB_EMBEDDER=gemini above has no local model to load.
# Measured since: a cold `kb-server refresh` of the `brew` base inside
# `docker run --memory=2g` stayed flat at 215-250 MiB and was not OOM-killed
# (scripts/bench/large-repo-memory-bench.sh), and a real 10-base cold seed on
# Fly peaked at 605 MiB whole-VM usage, again on `brew`. 2048mb leaves >3x
# headroom over the worst base measured.
#
# One performance core (down from 4) makes a cold seed of all 10 bases slower
# in wall-clock while costing ~4x less; the daily run takes the warm
# incremental path and is far lighter than a cold build either way. If a cold
# rebuild of every base ever needs to be fast, bump this block — the three
# `fly machine run` callers read it via scripts/fly/builder-args.mjs, so one
# edit here now reaches all of them instead of drifting apart (which it did,
# twice).
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
