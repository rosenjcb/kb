# Fly.io BUILDER for the kb chat demo — the daily, one-shot 4GB machine.
#
# This app has NO http service. Its single job: once a day, spawn a 4GB
# machine that rescans EVERY base in scripts/fly/bases.json + its git(s),
# publishes a fresh sha256-verified snapshot per base to Tigris, and rolls the
# serving app (kb-demo) onto them — then stops. Because it runs as a Fly
# *scheduled* machine that exits when done, the big node only costs money for the
# few minutes it actually builds each day.
#
# It shares the serving image (Dockerfile.fly) but overrides the command to the
# builder script and runs at 4GB.
#
# Setup (once):
#   fly apps create kb-demo-builder
#   fly deploy -c fly.builder.toml -a kb-demo-builder            # builds/pushes the image
#   # Give the builder access to the SAME bucket + provider key + a deploy token
#   # for the serving app so it can roll it:
#   fly storage update <tigris-id> --app kb-demo-builder         # or copy AWS_* + BUCKET_NAME secrets
#   fly secrets set -a kb-demo-builder GEMINI_API_KEY=... \
#       SERVE_APP=kb-demo \
#       FLY_API_TOKEN="$(fly tokens create deploy -a kb-demo --expiry 8760h | tail -n1)"
#   # Create the daily, run-to-completion machine (this is the scheduler):
#   fly machine run . -c fly.builder.toml -a kb-demo-builder \
#       --schedule daily --restart no --vm-memory 4096 \
#       bash /app/scripts/fly/refresh.sh
#
# Full model + operations: FLY_ORCHESTRATION.md

app = "kb-demo-builder"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  KB_HOME = "/data"
  KB_BASE = "kb"
  # Which bases to build is driven by scripts/fly/bases.json (the golden default
  # `demo` = this repo, plus one base per eval suite repo). Each base's cold build
  # clones its own repo; there is no single KB_GIT_REPOS anymore.
  # Ship tiny serve-only snapshots (drop working trees) so the 256MB serving node
  # can hold ~10 bases; per-base source links still resolve from snapshot manifest
  # provenance. Set to "false" to carry full working trees.
  SNAPSHOT_NO_REPOS = "true"
  LOG_LEVEL = "info"
  # Default (1800s/30min) was too tight for the biggest cold builds (brew,
  # kestra, lazygit's huge docs corpus, and this repo itself) — they missed
  # the window while smaller repos in the same run finished fine. Bumped once
  # empirically confirmed against the largest repos in bases.json.
  COLD_BUILD_TIMEOUT = "5400"
  # SERVE_APP, FLY_API_TOKEN, GEMINI_API_KEY, and the Tigris AWS_*/BUCKET_NAME
  # values are set as secrets (see setup above) — never hard-code them here.

# The builder is a batch job, not a service: no [http_service], no checks. The
# scheduled machine (created with `fly machine run --schedule daily`) runs
# scripts/fly/refresh.sh to completion and stops until the next day. 4GB gives
# cloning + indexing ~10 repos (incl. large ones like Homebrew/brew, kestra)
# headroom; the machine still stops between runs, so it only bills while building.
# performance-2x (dedicated, unthrottled cores) over shared-cpu-2x: the indexing
# pipeline (tree-sitter AST parsing + SQLite FTS matching) is single-threaded
# CPU-bound work, so a faster core — not more shared cores — is what actually
# speeds it up. At a few minutes/day this costs cents/month either way, so the
# tier choice is effectively free; take the speed.
[[vm]]
  size = "performance-2x"
  memory = "4096mb"
