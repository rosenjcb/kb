openapi: 3.0.3
info:
  title: kb server API
  version: 0.13.0
  description: >
    HTTP + MCP surface for the kb knowledge base service (`kb-server start`).
    `/v1/*` is a plain REST API for apps and the Slack integration; `/mcp` is a
    stateful MCP (Model Context Protocol) Streamable HTTP endpoint for LLM
    clients (`mcp-session-id` after initialize) and is only mounted when the
    server runs with `--with-mcp`. All `/v1/*` and `/mcp` requests require a
    bearer API key (`KB_SERVER_API_KEY`); `/health` and `/healthz` are open.


    One server process can serve many bases (psql-style). Select the base per
    request with the `X-KB-Base` header (or `?base=` on `/healthz`, or a body
    `base` on `/v1/query` and `/v1/chat`). An omitted base uses the server's
    boot/default base; an unknown base returns `404` with `status: unknown_base`.
servers:
  - url: http://localhost:38117
    description: Local / Docker
  - url: https://kb-server.example.com
    description: Hosted deployment

tags:
  - name: health
  - name: query
  - name: chat
  - name: admin
  - name: mcp
  - name: slack

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe (readiness in body)
      description: >
        Unauthenticated liveness endpoint — always HTTP 200 when the process can
        answer. Readiness is in the JSON body (`ok`, `indexing`, `reindexing`,
        `bootstrapError`). During a fresh bootstrap build, `indexing: true` and
        the latest progress line are surfaced as `bootstrapProgress`. Query/chat
        still return 503 while first-boot indexing is in progress.
      security: []
      responses:
        "200":
          description: >
            Process is alive. Check `ok` / `indexing` / `reindexing` for readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe alias
      description: >
        Alias of `/health`. Always HTTP 200 when reachable; readiness is in the
        body. `X-KB-Base` or `?base=<slug>` reports a specific served base.
      security: []
      parameters:
        - $ref: "#/components/parameters/XKbBase"
        - in: query
          name: base
          required: false
          schema: { type: string }
          description: Report readiness for this base (else the default base).
      responses:
        "200":
          description: >
            Process is alive. Check `ok` / `indexing` / `reindexing` for readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/query:
    post:
      tags: [query]
      summary: Ask a question; get a synthesized answer and sources
      parameters:
        - $ref: "#/components/parameters/XKbBase"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
            examples:
              synthesized:
                summary: Default (synthesized answer)
                value: { q: "how does authentication work?" }
              factsOnly:
                summary: Facts only, deep discovery
                value: { q: "rate limiting", synthesize: false, discovery: "deep" }
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownBase" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Query timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/chat:
    post:
      tags: [chat]
      summary: Multi-turn chat, streamed over Server-Sent Events
      description: >
        Returns `text/event-stream`. Events (each `data:` is JSON):
        `session` `{sessionId}`, then a sequence of `reasoning` `{text}`,
        `meta` `{text}` (stages and the model's KB queries), terminating in
        `answer` `{text, sources[], factsRetrieved}` and `done`, or `error`
        `{message}`. Reuse `sessionId` to retain conversation history.
      parameters:
        - $ref: "#/components/parameters/XKbBase"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              turn1:
                value: { sessionId: "demo-session", message: "how does authentication work?" }
      responses:
        "200":
          description: SSE stream of chat events
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: session
                  data: {"sessionId":"demo-session"}

                  event: answer
                  data: {"type":"answer","text":"...","sources":[],"factsRetrieved":3}

                  event: done
                  data: {"type":"done"}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownBase" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/bases:
    get:
      tags: [admin]
      summary: List the bases this server can serve
      description: >
        Returns every built base addressable on this host (the boot/default base
        plus any base with a `.kb-index.sqlite` under `~/.kb/sessions`). Select
        one per request with the `X-KB-Base` header.
      responses:
        "200":
          description: Served bases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/cli:
    post:
      tags: [admin]
      summary: Run kb server commands (init, scan, docs, facts, graph, logs, publish, base, …)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args]
              properties:
                args:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Command finished (check exitCode in body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exitCode: { type: integer }
                  output: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /mcp:
    post:
      tags: [mcp]
      summary: MCP Streamable HTTP endpoint (JSON-RPC 2.0)
      description: >
        Speaks the Model Context Protocol over JSON-RPC 2.0 (methods
        `initialize`, `tools/list`, `tools/call`). Stateful sessions: the
        initialize response returns `mcp-session-id`; every subsequent
        POST/GET/DELETE must send that header. Tools are `kb_query`,
        `submit_feedback` (one string `requestId` per call — not an array), and
        `get_feedback_requests`. Sampled feedback asks are gated by
        `KB_FEEDBACK_SAMPLE_RATE`; with `KB_MCP_ELICITATION=true` and a client
        that declared form elicitation, the ask is a user form, otherwise a
        top-level `AGENT_INSTRUCTION` on the kb_query payload. Not a normal
        REST resource — use an MCP client or the examples in `http/server.http`.
        Requires `Accept: application/json, text/event-stream`. Only available
        when the server runs with `--with-mcp`.
      parameters:
        - in: header
          name: mcp-session-id
          required: false
          schema: { type: string, format: uuid }
          description: >
            Required on every request after initialize. Omitted only for the
            initial `initialize` call, which returns this header on the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            examples:
              initialize:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: "initialize"
                  params:
                    protocolVersion: "2025-06-18"
                    capabilities: {}
                    clientInfo: { name: "example", version: "1.0" }
              toolsList:
                value: { jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }
              callKbQuery:
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: "tools/call"
                  params:
                    name: "kb_query"
                    arguments: { q: "what enforces rate limiting?" }
              callSubmitFeedback:
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: "tools/call"
                  params:
                    name: "submit_feedback"
                    arguments:
                      helped: "partial"
                      notes: "right file, but the answer missed the retry path"
                      answer: "Retries use exponential backoff via retryWithBackoff()."
                      query: "how does auth retry work?"
                      requestId: "<requestId from a kb_query response / x-request-id>"
              callGetFeedbackRequests:
                value:
                  jsonrpc: "2.0"
                  id: 5
                  method: "tools/call"
                  params:
                    name: "get_feedback_requests"
                    arguments: {}
      responses:
        "200":
          description: JSON-RPC response (includes `mcp-session-id` on initialize)
          headers:
            mcp-session-id:
              schema: { type: string, format: uuid }
              description: Session id to send on subsequent MCP requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "400":
          description: Missing/invalid MCP session id (after initialize)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [mcp]
      summary: MCP session SSE stream (server→client messages)
      description: >
        Opens the standalone SSE stream for an existing MCP session. Required
        for server-initiated requests such as form elicitation when
        `KB_MCP_ELICITATION=true`. Requires `mcp-session-id` and
        `Accept: text/event-stream`.
      parameters:
        - in: header
          name: mcp-session-id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: SSE stream (`text/event-stream`)
        "400":
          description: Invalid or missing MCP session id
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [mcp]
      summary: Terminate an MCP session
      description: Tears down the server+transport pair for `mcp-session-id`.
      parameters:
        - in: header
          name: mcp-session-id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session closed
        "400":
          description: Invalid or missing MCP session id
        "401": { $ref: "#/components/responses/Unauthorized" }

  /slack/events:
    post:
      tags: [slack]
      summary: Slack Events API webhook
      description: >
        Handles Slack Events API payloads when `SLACK_SIGNING_SECRET` and
        `SLACK_BOT_TOKEN` are configured. Validates the `x-slack-signature`
        HMAC-SHA256 header (rejects stale timestamps >5 min to prevent replay
        attacks). Routing: `url_verification` → echoes challenge; `app_mention`
        → multi-turn chat keyed on `thread_ts ?? event.ts` (first mention starts
        the session, replies in that thread continue it); `message`
        (`channel_type=im`) → multi-turn chat keyed on the user's DM channel.
        Bot events (with `bot_id` or `subtype`) are silently ignored to prevent
        reply loops. Duplicate `event_id` deliveries (Slack retries) are acked
        200 without re-processing. Responds 200 immediately; query/chat and the
        Slack reply happen asynchronously.
      security: []
      parameters:
        - in: header
          name: x-slack-signature
          required: true
          schema: { type: string }
          description: "`v0=<HMAC-SHA256>` of `v0:{timestamp}:{body}` signed with `SLACK_SIGNING_SECRET`"
        - in: header
          name: x-slack-request-timestamp
          required: true
          schema: { type: string }
          description: Unix epoch seconds; rejected if more than 5 minutes old.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlackEventPayload" }
      responses:
        "200":
          description: Ack (or challenge response for url_verification)
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string, description: "Echoed for url_verification only" }
        "400":
          description: Malformed body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid or missing Slack signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token matching one of the server's KB_SERVER_API_KEY values.

  parameters:
    XKbBase:
      in: header
      name: X-KB-Base
      required: false
      schema: { type: string }
      description: >
        Select the server-side base (slug) for this request. Omit to use the
        server's boot/default base. Unknown base ⇒ 404 `unknown_base`.

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownBase:
      description: The requested `X-KB-Base` has no built index on this server
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [ok, base]
      properties:
        ok: { type: boolean }
        base: { type: string, description: Active base name }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        indexMtime:
          type: string
          format: date-time
          nullable: true
          description: >
            Last-modified time of `.kb-index.sqlite` (updated by init, scan, and
            reindex — not first-boot-only).
        version:
          type: object
          required: [server]
          description: User-facing package version running on this node (`@kb/server`).
          properties:
            server:
              type: string
              description: `@kb/server` semver
        indexing:
          type: boolean
          description: True while a fresh bootstrap build is running in the background.
        bootstrapError:
          type: string
          nullable: true
          description: Sticky bootstrap failure, when the background build crashed.
        bootstrapProgress:
          type: string
          nullable: true
          description: Latest init/scan progress line emitted by the bootstrap worker.
        reindexing:
          type: boolean
          description: True while an incremental rescan is in progress.

    QueryRequest:
      type: object
      properties:
        q:
          type: string
          description: The question. `query` is accepted as an alias.
        query:
          type: string
          description: Alias for `q`.
        discovery:
          type: string
          enum: [shallow, deep]
        synthesize:
          type: boolean
          default: true
          description: When false, skip LLM synthesis and return facts only.
        verbose:
          type: boolean
        trace:
          type: boolean
          description: >
            When true, write an opt-in deep retrieval trace dump on the server
            (`KB_HOME/traces`) and return its path as `traceFile` in the response.
        base:
          type: string
          description: Per-call base override (else the `X-KB-Base` header).
      description: Requires `q` (or `query`).

    QuerySource:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        filePath: { type: string }
        tags:
          type: array
          items: { type: string }
        snippet: { type: string }

    QueryResponse:
      type: object
      required: [status, answer, results, retrieval]
      properties:
        status:
          type: string
          enum: [accepted, valid, invalid, uncertain, error, pending_review]
        answer:
          type: string
          nullable: true
          description: Synthesized answer, or null when synthesize=false / none produced.
        results:
          type: array
          items: { $ref: "#/components/schemas/QuerySource" }
        retrieval:
          type: object
          properties:
            method: { type: string }
            detail: { type: string }
        confidence:
          type: number
          format: float
        traceFile:
          type: string
          description: Server path to the deep trace dump when `trace: true` was requested.

    ChatRequest:
      type: object
      required: [message]
      properties:
        sessionId:
          type: string
          description: Conversation id. Generated and returned (via the `session` event) when omitted.
        message:
          type: string
        base:
          type: string
          description: Per-call base override (else the `X-KB-Base` header).

    BasesResponse:
      type: object
      required: [default, bases]
      properties:
        default: { type: string, description: The server's boot/default base name. }
        bases:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
              default: { type: boolean }
              repos:
                type: array
                description: >
                  Source repos indexed into this base, for building per-base source
                  links. Sourced from the snapshot manifest provenance (present even
                  for serve-only snapshots) or the live git clones.
                items:
                  type: object
                  required: [slug, branch]
                  properties:
                    slug: { type: string, description: Origin repo slug (matches a source's gitRepo). }
                    url:
                      type: [string, "null"]
                      description: HTTPS browse root (no trailing slash), or null when not derivable.
                    branch: { type: string, description: Clone HEAD branch, for blob links. }

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        method: { type: string }
        params: { type: object, additionalProperties: true }

    JsonRpcResponse:
      type: object
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        status:
          type: string
          enum: [indexing, bootstrap_failed]
          description: Present when the request is blocked by bootstrap availability.
        progress:
          type: string
          description: Latest init/scan progress line when bootstrap work is still running.

    SlackEventPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: "`url_verification` or `event_callback`"
        challenge:
          type: string
          description: Present only for `url_verification`
        event_id:
          type: string
          description: Unique event ID; used for deduplication on retries
        event:
          type: object
          properties:
            type: { type: string, description: "e.g. `app_mention`, `message`" }
            text: { type: string }
            user: { type: string }
            channel: { type: string }
            channel_type: { type: string, description: "`im` for direct messages" }
            ts: { type: string }
            thread_ts: { type: string, description: "Present when the event is part of a thread" }
            bot_id: { type: string, description: "Present on bot-posted messages; causes the event to be ignored" }
            subtype: { type: string, description: "Present for message subtypes; causes the event to be ignored" }

security:
  - bearerAuth: []
