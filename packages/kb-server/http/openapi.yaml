openapi: 3.0.3
info:
  title: kb server API
  version: 0.12.0
  description: >
    HTTP + MCP surface for the kb knowledge base service (`kb-server start`).
    `/v1/*` is a plain REST API for apps and the Slack integration; `/mcp` is an
    MCP (Model Context Protocol) Streamable HTTP endpoint for LLM clients and is
    only mounted when the server runs with `--with-mcp`. All `/v1/*` and `/mcp`
    requests require a bearer API key (`KB_SERVER_API_KEY`); `/health` and
    `/healthz` are open.
servers:
  - url: http://localhost:38117
    description: Local / Docker
  - url: https://kb-server.example.com
    description: Hosted deployment

tags:
  - name: health
  - name: query
  - name: chat
  - name: admin
  - name: mcp
  - name: slack

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness / readiness probe
      description: >
        Unauthenticated health endpoint. Returns the active base plus index
        metadata. During a fresh bootstrap build, `indexing: true` and the
        latest CLI/TUI-style progress line are surfaced as `bootstrapProgress`.
      security: []
      responses:
        "200":
          description: Service is ready to serve queries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Bootstrap indexing in progress, bootstrap failed, or index not yet present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /healthz:
    get:
      tags: [health]
      summary: Liveness / readiness probe alias
      description: Alias of `/health`. Returns HTTP 503 until the on-disk index is ready.
      security: []
      responses:
        "200":
          description: Service is ready to serve queries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Bootstrap indexing in progress, bootstrap failed, or index not yet present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/query:
    post:
      tags: [query]
      summary: Ask a question; get a synthesized answer and sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
            examples:
              synthesized:
                summary: Default (synthesized answer)
                value: { q: "how does authentication work?" }
              factsOnly:
                summary: Facts only, deep discovery
                value: { q: "rate limiting", synthesize: false, limit: 10, discovery: "deep" }
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Query timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/chat:
    post:
      tags: [chat]
      summary: Multi-turn chat, streamed over Server-Sent Events
      description: >
        Returns `text/event-stream`. Events (each `data:` is JSON):
        `session` `{sessionId}`, then a sequence of `reasoning` `{text}`,
        `meta` `{text}` (stages and the model's KB queries), terminating in
        `answer` `{text, sources[], factsRetrieved}` and `done`, or `error`
        `{message}`. Reuse `sessionId` to retain conversation history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              turn1:
                value: { sessionId: "demo-session", message: "how does authentication work?" }
      responses:
        "200":
          description: SSE stream of chat events
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: session
                  data: {"sessionId":"demo-session"}

                  event: answer
                  data: {"type":"answer","text":"...","sources":[],"factsRetrieved":3}

                  event: done
                  data: {"type":"done"}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/reindex:
    post:
      tags: [admin]
      summary: Trigger an on-demand incremental rescan
      responses:
        "200":
          description: Rescan completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReindexResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A reindex is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/admin/cli:
    post:
      tags: [admin]
      summary: Run kb server commands (init, scan, docs, facts, graph, logs, publish, base, …)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args]
              properties:
                args:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Command finished (check exitCode in body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exitCode: { type: integer }
                  output: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /mcp:
    post:
      tags: [mcp]
      summary: MCP Streamable HTTP endpoint (JSON-RPC 2.0)
      description: >
        Speaks the Model Context Protocol over JSON-RPC 2.0 (methods
        `initialize`, `tools/list`, `tools/call`). Not a normal REST resource —
        use an MCP client or the examples in `http/server.http`. Requires the
        `Accept: application/json, text/event-stream` header. Only available when
        the server runs with `--with-mcp`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            examples:
              toolsList:
                value: { jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }
              callKbQuery:
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: "tools/call"
                  params:
                    name: "kb_query"
                    arguments: { q: "what enforces rate limiting?", synthesize: false }
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Bootstrap indexing is still in progress or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /slack/events:
    post:
      tags: [slack]
      summary: Slack Events API webhook
      description: >
        Handles Slack Events API payloads when `SLACK_SIGNING_SECRET` and
        `SLACK_BOT_TOKEN` are configured. Validates the `x-slack-signature`
        HMAC-SHA256 header (rejects stale timestamps >5 min to prevent replay
        attacks). Routing: `url_verification` → echoes challenge; `app_mention`
        → multi-turn chat keyed on `thread_ts ?? event.ts` (first mention starts
        the session, replies in that thread continue it); `message`
        (`channel_type=im`) → multi-turn chat keyed on the user's DM channel.
        Bot events (with `bot_id` or `subtype`) are silently ignored to prevent
        reply loops. Duplicate `event_id` deliveries (Slack retries) are acked
        200 without re-processing. Responds 200 immediately; query/chat and the
        Slack reply happen asynchronously.
      security: []
      parameters:
        - in: header
          name: x-slack-signature
          required: true
          schema: { type: string }
          description: "`v0=<HMAC-SHA256>` of `v0:{timestamp}:{body}` signed with `SLACK_SIGNING_SECRET`"
        - in: header
          name: x-slack-request-timestamp
          required: true
          schema: { type: string }
          description: Unix epoch seconds; rejected if more than 5 minutes old.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlackEventPayload" }
      responses:
        "200":
          description: Ack (or challenge response for url_verification)
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string, description: "Echoed for url_verification only" }
        "400":
          description: Malformed body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid or missing Slack signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token matching one of the server's KB_SERVER_API_KEY values.

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [ok, base]
      properties:
        ok: { type: boolean }
        base: { type: string, description: Active base name }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        indexMtime:
          type: string
          format: date-time
          nullable: true
          description: Last-modified time of the on-disk index, when present.
        indexing:
          type: boolean
          description: True while a fresh bootstrap build is running in the background.
        bootstrapError:
          type: string
          nullable: true
          description: Sticky bootstrap failure, when the background build crashed.
        bootstrapProgress:
          type: string
          nullable: true
          description: Latest init/scan progress line emitted by the bootstrap worker.
        reindexing:
          type: boolean
          description: True while an incremental rescan is in progress.

    QueryRequest:
      type: object
      properties:
        q:
          type: string
          description: The question. `query` is accepted as an alias.
        query:
          type: string
          description: Alias for `q`.
        limit:
          type: integer
          description: Max facts to retrieve.
        type:
          type: string
          description: Optional document-type filter.
        discovery:
          type: string
          enum: [shallow, deep]
        synthesize:
          type: boolean
          default: true
          description: When false, skip LLM synthesis and return facts only.
        verbose:
          type: boolean
        trace:
          type: boolean
          description: >
            When true, write an opt-in deep retrieval trace dump on the server
            (`KB_HOME/traces`) and return its path as `traceFile` in the response.
      description: Requires `q` (or `query`).

    QuerySource:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        filePath: { type: string }
        tags:
          type: array
          items: { type: string }
        snippet: { type: string }

    QueryResponse:
      type: object
      required: [status, answer, results, retrieval]
      properties:
        status:
          type: string
          enum: [accepted, valid, invalid, uncertain, error, pending_review]
        answer:
          type: string
          nullable: true
          description: Synthesized answer, or null when synthesize=false / none produced.
        results:
          type: array
          items: { $ref: "#/components/schemas/QuerySource" }
        retrieval:
          type: object
          properties:
            method: { type: string }
            detail: { type: string }
        confidence:
          type: number
          format: float
        traceFile:
          type: string
          description: Server path to the deep trace dump when `trace: true` was requested.

    ChatRequest:
      type: object
      required: [message]
      properties:
        sessionId:
          type: string
          description: Conversation id. Generated and returned (via the `session` event) when omitted.
        message:
          type: string

    ReindexResponse:
      type: object
      required: [status, summary]
      properties:
        status: { type: string, example: ok }
        summary: { type: string }

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        method: { type: string }
        params: { type: object, additionalProperties: true }

    JsonRpcResponse:
      type: object
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: { oneOf: [{ type: string }, { type: integer }] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        status:
          type: string
          enum: [indexing, bootstrap_failed]
          description: Present when the request is blocked by bootstrap availability.
        progress:
          type: string
          description: Latest init/scan progress line when bootstrap work is still running.

    SlackEventPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: "`url_verification` or `event_callback`"
        challenge:
          type: string
          description: Present only for `url_verification`
        event_id:
          type: string
          description: Unique event ID; used for deduplication on retries
        event:
          type: object
          properties:
            type: { type: string, description: "e.g. `app_mention`, `message`" }
            text: { type: string }
            user: { type: string }
            channel: { type: string }
            channel_type: { type: string, description: "`im` for direct messages" }
            ts: { type: string }
            thread_ts: { type: string, description: "Present when the event is part of a thread" }
            bot_id: { type: string, description: "Present on bot-posted messages; causes the event to be ignored" }
            subtype: { type: string, description: "Present for message subtypes; causes the event to be ignored" }

security:
  - bearerAuth: []
