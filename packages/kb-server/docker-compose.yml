# Local / single-host run of the kb server.
#
# Getting started (recommended): `pnpm run server:up` — see packages/kb-server/README.md.
# Raw compose (from the repo root):
#
#   cp .env.example .env   # then fill in a provider key + a strong KB_SERVER_API_KEY
#   docker compose -f packages/kb-server/docker-compose.yml up -d --build
#
# The `llm-mock` service is a TEST-ONLY WireMock sidecar, gated behind the `mock`
# compose profile so production / real runs never start it. `pnpm run integration:test`
# enables it (`--profile mock`) and points Gemini at it via GEMINI_API_BASE_URL — no real
# provider key required. Stub details: docker/wiremock/WIREMOCK.md
#
# Persistent volume at /data (KB_HOME), first boot builds the index from
# KB_GIT_REPOS, later boots reuse it.

services:
  # Test-only LLM stub. Inert unless the `mock` profile is enabled (integration tests).
  llm-mock:
    image: wiremock/wiremock:3.9.1
    profiles: ["mock"]
    ports:
      - "${LLM_MOCK_PORT:-18080}:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]

  kb-server:
    build:
      context: ../..
      dockerfile: packages/kb-server/Dockerfile
    image: kb-server
    ports:
      - "${PORT:-8080}:8080"
    environment:
      KB_HOME: /data
      PORT: "8080"
      KB_BASE: "${KB_BASE:-demo}"
      # Set on first boot to clone + index a fresh base; can be cleared afterwards.
      KB_GIT_REPOS: "${KB_GIT_REPOS:-}"
      KB_SERVER_API_KEY: "${KB_SERVER_API_KEY:-testkey}"
      KB_REINDEX_INTERVAL: "${KB_REINDEX_INTERVAL:-1h}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GH_TOKEN: "${GH_TOKEN:-}"
      KB_SERVER_ENABLE_SLACK: "${KB_SERVER_ENABLE_SLACK:-}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      # Provide one of these (read from your .env / shell). Gemini shown as default.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_API_BASE_URL: "${GEMINI_API_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Structured log verbosity: debug | info | warn | error (default: info).
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - kb-data:/data
    restart: unless-stopped
    healthcheck:
      # node:24-slim has no curl; use node's built-in fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot clones + indexes before listening; give it room.
      start_period: 300s

volumes:
  kb-data:
