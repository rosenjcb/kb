# Ruby ecosystem harvester coverage (reviewable scope).
# Inference: harvestRubyEcosystem in ecosystem-harvesters.ts.
#
# Emits: one entity per installable unit — *.gemspec packages and
# app roots that have a Gemfile (Rails apps often have Gemfile, no gemspec).
# Rails engines are gemspec packages with engine.rb / railtie signals.
# Does not emit: HTTP routes, in-code symbols, or Homebrew formulae.
# Edges (intended): path-gem / engine → host app via part_of when Gemfile
# references `gem "x", path: "..."`.

id: ruby
display_name: Ruby
status: implemented

# Manifest atoms. Prefer gemspec for identity; Gemfile declares deps + path members.
package_manifests:
  - path: "*.gemspec"
    format: gemspec
    role: package # harvest atom — Gem::Specification#name = canonical name
  - path: Gemfile
    format: gemfile
    role: package # app root when no gemspec (typical Rails app)
  - path: Gemfile
    format: gemfile
    role: workspace # `gem "…", path:` + `gemspec` → member dirs
  - path: Gemfile.lock
    format: bundler_lock
    role: lock # companion only; never an entity

# Identity / gloss:
#   gemspec  → canonicalName ← spec.name; gloss ← summary || description
#              aliases ← name; hyphen/underscore forms; basename; executables
#   Gemfile-only app → canonicalName ← directory basename (or module from
#              config/application.rb when present); gloss ← README
#   engines  → same as gemspec; also alias engine_name when detectable

# Path / engine membership (no first-class Bundler workspace table).
# Host Gemfile: gem "blorgh", path: "engines/blorgh" → member gemspec root.
# Developing a gem: Gemfile calls `gemspec` to pull runtime/dev deps from *.gemspec.
workspace:
  sources:
    - path: Gemfile
      path_gems: true # Bundler path: / git: local members
      gemspec_method: true # `gemspec` / `gemspec path:` pulls package atom
  # Globs for engine layouts commonly seen in monorepos (discovery fallback).
  engine_globs:
    - engines/*
    - gems/*
    - components/*

# Named dependency groups — gem names as they appear in Gemfile / gemspec
# add_dependency / add_runtime_dependency (and Gemfile `gem "name"`).
# Match direct declarations only; ignore transitive from Gemfile.lock.
frameworks:
  server:
    - rails
    - railties # engines / plugins often depend on railties without full rails
    - sinatra
    - hanami
    - grape
    - rack # low-level; weak alone but common detect
    - padrino # still seen; not a greenfield default
  frontend:
    # Hotwire stack + view components — surface signals when no server wins
    - view_component
    - turbo-rails
    - stimulus-rails
    - hotwire-rails # meta gem still appears in older apps
    - propshaft # asset pipeline; weak surface cue alone
  cli:
    - thor # dominant (Rails generators use it)
    - gli
    - commander # detect; less maintained than thor

# Avoid as primary (do not add): merb, camping, ramaze, cuba-as-default
# (niche / abandoned). Homebrew formulae are Ruby DSLs but OUT OF SCOPE —
# this harvester targets application/library repos' Gemfile + gemspec only.

# First matching rule wins. Rules carry no weights — if a signal is too weak to
# act on, leave the rule out rather than discounting it.
# Match keys document intended signals for the future Ruby harvester.
#
# Engine vs app:
#   has_rails_engine ← lib/**/engine.rb subclassing Rails::Engine
#                      (and not Rails::Application)
#   has_rails_app    ← config/application.rb / Rails::Application / bin/rails
# gemspec executables ← spec.executables / bindir (≈ npm bin)
kind_rules:
  - kind: service
    match:
      any_dependency_group: server
      without_rails_engine: true # host apps / Sinatra / Grape win as service
  - kind: service
    match:
      has_rails_app: true
  - kind: library
    match:
      has_rails_engine: true # mountable engine gem — reusable package
  - kind: cli
    match:
      has_executables: true # gemspec executables
  - kind: cli
    match:
      any_dependency_group: cli
      without_dependency_group: server
  - kind: surface
    match:
      any_dependency_group: frontend
      without_dependency_group: server
  - kind: library
    match:
      has_gemspec: true
      without_executables: true
      without_dependency_group: server
  - kind: library
    match: {} # fallback — Gemfile-only with no stronger signal

# Declared coverage gaps — not harvested yet (tier-4 in ECOSYSTEM_HARVESTERS.spec.md §4a).
symbols:
  status: partial
  note: >
    Best-effort: Rails *Controller / *Service classes → module;
    ApplicationRecord / ActiveRecord::Base → model kind. Other symbols
    stay in tree-sitter.
  planned: []

routes:
  status: partial
  note: >
    Best-effort Rails config/routes.rb with namespace/scope stacks joined to
    nested resources/verbs, `resources :x` → full CRUD, singular
    `resource :x` member routes. Sinatra verb DSL and
    Grape API routes also matched.
  planned_frameworks:
    - hanami

app_classes:
  status: partial
  note: 'Rails *Controller / *Service / *Interactor → module.'

models:
  status: partial
  note: ApplicationRecord / ActiveRecord::Base → model.

# Executable tier-4 harvest rules (pattern-engine). Status/note above are summaries.
source_patterns:
  - id: rails_resources_crud
    kind: api
    gloss: Rails nested routes
    filter: plausible_http_route
    strategy: rails_resources_crud
    files:
      extensions:
        - .rb
      path_suffixes:
        - routes.rb
  - id: sinatra_verbs
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Sinatra route
    pattern: ^\s*(?:get|post|put|patch|delete|options|head)\s+['"]([^'"]+)['"]
    flags: gm
    name_template: '{1|/}'
    files:
      extensions:
        - .rb
  - id: grape_verbs
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Grape route
    pattern: \b(?:get|post|put|patch|delete)\s+['"]([^'"]+)['"]
    flags: g
    name_group: 1
    require_leading_slash: true
    files:
      extensions:
        - .rb
  - id: grape_resource_symbol
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Grape resource
    pattern: \bresource\s+:([a-z][a-z0-9_]*)
    flags: g
    name_template: /{1}
    files:
      extensions:
        - .rb
  - id: rails_controller
    kind: module
    filter: plausible_type_name
    strategy: regex
    gloss: Rails controller
    pattern: >-
      ^class\s+([A-Z][A-Za-z0-9_]*(?:::[A-Z][A-Za-z0-9_]*)*)\s*<\s*(?:ApplicationController|ActionController::Base|ActionController::API)
    flags: gm
    name_template: '{1|class_leaf}'
    alias_groups:
      - 1
    files:
      extensions:
        - .rb
  - id: rails_app_suffix
    kind: module
    filter: plausible_type_name
    strategy: regex
    gloss: Rails application class
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*(?:Service|Interactor|Worker|Job|Query|Command))\b
    flags: gm
    name_group: 1
    files:
      extensions:
        - .rb
  - id: activerecord_model
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: ActiveRecord model
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*)\s*<\s*(?:ApplicationRecord|ActiveRecord::Base)
    flags: gm
    name_group: 1
    files:
      extensions:
        - .rb
  - id: activerecord_table_name
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: ActiveRecord table_name
    pattern: self\.table_name\s*=\s*['"]([^'"]+)['"]
    flags: g
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .rb
