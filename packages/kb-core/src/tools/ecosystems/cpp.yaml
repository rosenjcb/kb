# C / C++ ecosystem harvester coverage (reviewable scope).
# Inference: harvestCppEcosystem in ecosystem-harvesters.ts (CMake project() first).
#
# Package identity is inherently weak vs npm/Cargo/go.mod. Prefer named
# project()/vcpkg/conan/xmake atoms when present; Makefile and compile_commands
# are not strong identity. Many repos are libraries (raylib-style) → the library
# fallback is the common case, not a failure.
#
# Emits: one entity candidate per discoverable project/package atom.
# Does not emit: HTTP routes or in-code symbols (see symbols/ / routes/).

id: cpp
display_name: C / C++
status: implemented

# Manifest atoms, strongest → weakest. Multiple may coexist; prefer the
# strongest identity present (vcpkg/conan name > CMake project() > meson
# project() > Makefile TARGET). See research/cpp.md.
package_manifests:
  # --- Package-manager identity (closest to npm package.json) ---
  - path: vcpkg.json
    format: vcpkg
    role: package # `name` field = canonical when present
  - path: conanfile.py
    format: conan_py
    role: package # name/version in recipe; stronger than .txt
  - path: conanfile.txt
    format: conan_txt
    role: package # [requires] only — weak name; often no package name
  - path: xmake.lua
    format: xmake
    role: package # set_project("name") / target("name")

  # --- Build-system identity (common; name may be missing or generic) ---
  - path: CMakeLists.txt
    format: cmake
    role: package # project(Name …) — harvest atom when project() present
  - path: meson.build
    format: meson
    role: package # project('name', …)

  # --- Weak / non-identity ---
  - path: Makefile
    format: makefile
    role: weak_package # TARGET/phony only; no stable package identity
  - path: compile_commands.json
    format: compile_commands
    role: companion # clangd/IDE DB — never an entity
  - path: "*.pc"
    format: pkg_config
    role: package # rare in-repo; installed system .pc is out of tree

# Identity / gloss (when a name exists):
#   canonicalName ← vcpkg.json name | conan name | xmake project/target |
#                   CMake project() | meson project() | Makefile TARGET (weak)
#   aliases       ← directory basename; lib-stripped forms; .pc Name
#   gloss         ← README; else Doxygen / file-level comments — no standard field

# Named dependency groups — referenced by kind_rules.match.any_dependency_group.
# Names are detection tokens across CMake find_package / vcpkg / Conan / #include
# roots (normalized lowercase, separators collapsed). See research/cpp.md for
# spelling variants (boost-beast vs Boost::beast vs <boost/beast.hpp>).
frameworks:
  server:
    - crow
    - oatpp
    - pistache
    - drogon
    - cpprestsdk
    - grpc
    - boost.beast
  cli:
    - cli11
    - cxxopts
    - boost.program_options
  surface:
    - qt
    - gtk
    - imgui
    - wxwidgets

# Avoid as primary (do not add): raw sockets / asio alone (too common as a
# transitive/util dep); libcurl alone; Boost.Asio without Beast/HTTP layer.

# First matching rule wins. Rules carry no weights — C/C++ deps are
# often header-only, system-installed, or undeclared in-repo. Match keys document
# intended signals for a future harvester.
kind_rules:
  - kind: service
    match:
      any_dependency_group: server
  - kind: surface
    match:
      any_dependency_group: surface
  - kind: cli
    match:
      any_dependency_group: cli
  - kind: library
    match:
      has_installable_headers: true # public include/ or install(FILES …)
      without_dependency_group: server
  - kind: library
    match: {} # fallback — most C/C++ repos (raylib-style libraries)

# Declared coverage gaps — not harvested yet (tier-4 in ECOSYSTEM_HARVESTERS.spec.md §4a).
symbols:
  status: not_implemented
  note: >
    C/C++ symbols (funcs, types, macros) stay in the tree-sitter code-index
    cycle (.c/.h/.cpp/.cc/.hpp). No common ORM/service-class convention
    harvested as entities yet.
  planned: []

routes:
  status: partial
  note: >
    Crow CROW_ROUTE and Drogon ADD_METHOD_TO macros.
  planned_frameworks: []

app_classes:
  status: not_implemented
  note: No common service-class convention harvested as entities.

models:
  status: not_implemented
  note: No common C/C++ ORM model harvest yet.

# Executable tier-4 harvest rules (pattern-engine). Status/note above are summaries.
source_patterns:
  - id: crow_route
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Crow route
    pattern: CROW_ROUTE\s*\(\s*[^,]+,\s*"([^"]+)"\s*\)
    flags: g
    name_group: 1
    files:
      extensions:
        - .cpp
        - .cc
        - .cxx
        - .h
        - .hpp
  - id: drogon_add_method
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Drogon route
    pattern: ADD_METHOD_TO\s*\(\s*[^,]+,\s*"([^"]+)"\s*,\s*(?:Get|Post|Put|Patch|Delete)
    flags: g
    name_group: 1
    files:
      extensions:
        - .cpp
        - .cc
        - .cxx
        - .h
        - .hpp
