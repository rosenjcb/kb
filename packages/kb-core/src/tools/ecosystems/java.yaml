# JVM (Java / Kotlin) ecosystem harvester coverage (reviewable scope).
# Inference: harvestJavaEcosystem in ecosystem-harvesters.ts (Maven first;
# settings.gradle include as optional fallback).
#
# Kotlin shares Maven/Gradle manifests — harvested under this id (not a
# separate ecosystem). Scala-first Maven/Gradle modules may dual-claim with
# scala.yaml; prefer scala.yaml when Scala plugin + .scala sources dominate.
#
# Emits: one entity candidate per Maven module (pom.xml) or Gradle
# project (build.gradle / build.gradle.kts), enumerated via settings.gradle(.kts)
# `include` when present.
# Does not emit: HTTP routes or in-code symbols (see symbols/ / routes/).
# Edges: multi-module member → root/reactor via part_of.

id: java
display_name: Java / Kotlin (JVM)
status: implemented

# Manifest atoms. Maven and Gradle are peers — either may be the sole build.
# libs.versions.toml is catalog-only (never an entity).
package_manifests:
  - path: pom.xml
    format: maven_pom
    role: package # harvest atom — <artifactId> (+ <groupId>) = identity
  - path: build.gradle
    format: gradle
    role: package # Groovy DSL project
  - path: build.gradle.kts
    format: gradle_kts
    role: package # Kotlin DSL project
  - path: settings.gradle
    format: gradle_settings
    role: workspace # `include` / `includeFlat` → member projects
  - path: settings.gradle.kts
    format: gradle_settings_kts
    role: workspace
  - path: gradle/libs.versions.toml
    format: gradle_version_catalog
    role: catalog # version/library aliases only; never an entity

# Identity / gloss:
#   Maven  canonicalName ← <artifactId> (alias groupId:artifactId);
#          packaging jar/war/ear; modules via <modules>
#   Gradle canonicalName ← settings rootProject.name / project path
#          (`:app`) or archivesBaseName / base.archivesName; else dir basename
#   gloss  ← Maven <description> / <name>; else README

workspace:
  sources:
    - path: pom.xml
      members_key: modules # <modules><module>…</module></modules>
      # Reactor root often packaging=pom — emit members; optional weak root
    - path: settings.gradle
      members_key: include # include 'app', 'lib' / include(":app")
    - path: settings.gradle.kts
      members_key: include
  # part_of: each member → reactor/settings root identity
  # Version catalog (libs.versions.toml) may live under gradle/; resolve
  # dependency aliases when matching frameworks.* — not a workspace source.

# Named dependency / plugin groups — Maven GAVs, Gradle coordinates, or
# recognizable plugin ids. Match direct deps + applied plugins; ignore
# transitive (spring-core often transitive of spring-boot — list starters /
# BOMs that appear in <dependencies> / implementation(...)).
frameworks:
  server:
    # Spring Boot (plugin + starters — either is enough)
    - org.springframework.boot # spring-boot-maven-plugin / gradle plugin id
    - spring-boot-starter-web
    - spring-boot-starter-webflux
    - spring-boot-starter-actuator
    # Quarkus / Micronaut / Dropwizard / Helidon / Vert.x
    - io.quarkus
    - io.quarkus.platform # BOM
    - io.micronaut
    - io.micronaut.platform
    - io.dropwizard
    - io.dropwizard.core
    - io.helidon
    - io.helidon.microprofile
    - io.vertx
    - io.vertx:vertx-web
    # Kotlin HTTP
    - io.ktor # io.ktor:ktor-server-*
    - io.ktor:ktor-server-core
  surface:
    - com.vaadin
    - com.vaadin:vaadin-spring-boot-starter
    - org.openjfx # JavaFX (OpenJFX)
    - javafx-controls
    # Android — detect carefully; see research/java.md. Not a default surface
    # signal for plain JVM libs; only when android plugin / applicationId present.
    - com.android.application # AGP — mobile app, not Vaadin/JavaFX
    - com.android.library
  cli:
    - info.picocli
    - info.picocli:picocli
    - com.beust:jcommander
    - com.beust.jcommander

# Avoid as primary (do not add): SparkJava / Javalin as sole frontier defaults
# (still exist; detect later if needed). Struts 1.x / ancient MVC — legacy only.

# First matching rule wins. Confidence drops when the signal is weak.
# Match keys document intended signals for the future JVM harvester.
#
# Packaging / plugin signals (Maven + Gradle):
#   has_spring_boot_plugin  ← spring-boot-maven-plugin or org.springframework.boot
#   has_application_plugin  ← application plugin / mainClass / mainClassName
#   has_main_class          ← <mainClass> / application { mainClass } / jar Main-Class
#   packaging_war           ← <packaging>war</packaging> or war plugin
#   packaging_jar           ← default jar / java-library
#   has_android_plugin      ← com.android.application|library
kind_rules:
  - kind: service
    confidence: 0.95
    match:
      has_spring_boot_plugin: true
  - kind: service
    confidence: 0.9
    match:
      any_dependency_group: server
  - kind: service
    confidence: 0.85
    match:
      packaging_war: true
  - kind: surface
    confidence: 0.8
    match:
      has_android_plugin: true
      note: >
        Android apps are mobile surfaces — separate from Vaadin/JavaFX.
        Prefer weak confidence; do not treat every Android library as surface.
  - kind: surface
    confidence: 0.75
    match:
      any_dependency_group: surface
      without_android_plugin: true # Vaadin / JavaFX only when not AGP
  - kind: cli
    confidence: 0.85
    match:
      any_dependency_group: cli
      has_main_class: true
  - kind: cli
    confidence: 0.75
    match:
      any_dependency_group: cli
  - kind: cli
    confidence: 0.7
    match:
      has_application_plugin: true
      has_main_class: true
      without_dependency_group: server
  - kind: library
    confidence: 0.75
    match:
      packaging_jar: true
      without_main_class: true
      without_dependency_group: server
  - kind: library
    confidence: 0.55
    match:
      has_main_class: true # runnable jar, no stronger dep/plugin signal
  - kind: library
    confidence: 0.4
    match: {} # fallback

symbols:
  status: partial
  note: >
    Best-effort: Spring @Service/@RestController/@Controller/@Repository
    classes → module; JPA @Entity/@Table → model kind. Other symbols stay
    in tree-sitter (.java). Kotlin .kt/.kts included in regex harvest only.
  planned: []

routes:
  status: partial
  note: >
    Best-effort regex for Spring class-level @RequestMapping joined to
    method-level @GetMapping/@PostMapping/… (`/api` + `/users` → `/api/users`),
    Micronaut @Controller + @Get join, JAX-RS/Quarkus class @Path + method
    @GET/@Path join, and Ktor get("/path") with leading slash. Confidence
    ~0.5; capped. RouterFunction builders still not covered.
  planned_frameworks:
    - spring-webflux # RouterFunction DSL

app_classes:
  status: partial
  note: Spring @Service/@RestController/@Controller/@Repository classes → module.

models:
  status: partial
  note: >
    JPA @Entity/@Table, Room @Entity(tableName=…), and Hibernate XML
    class/table mappings → model kind.

# Executable tier-4 harvest rules (pattern-engine). Status/note above are summaries.
source_patterns:
  - id: spring_class_method_join
    kind: api
    gloss: Spring MVC mapping
    confidence: 0.5
    filter: plausible_http_route
    strategy: class_method_prefix_join
    join_style: spring
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: micronaut_controller_join
    kind: api
    gloss: Micronaut controller route
    confidence: 0.5
    filter: plausible_http_route
    strategy: class_method_prefix_join
    join_style: micronaut
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: jaxrs_path_join
    kind: api
    gloss: JAX-RS path join
    confidence: 0.5
    filter: plausible_http_route
    strategy: class_method_prefix_join
    join_style: jaxrs
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: jaxrs_path_annotation
    kind: api
    confidence: 0.5
    filter: plausible_http_route
    strategy: regex
    gloss: JAX-RS @Path
    pattern: '@Path\s*\(\s*[''"]([^''"]+)[''"]\s*\)'
    flags: g
    name_group: 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: ktor_verb_routes
    kind: api
    confidence: 0.5
    filter: plausible_http_route
    strategy: regex
    gloss: Ktor route
    pattern: \b(?:get|post|put|patch|delete|head|options)\s*\(\s*"(\/[^"]*)"\s*\)
    flags: g
    name_group: 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: ktor_route_block
    kind: api
    confidence: 0.5
    filter: plausible_http_route
    strategy: regex
    gloss: Ktor route block
    pattern: \broute\s*\(\s*"(\/[^"]*)"\s*\)\s*\{
    flags: g
    name_group: 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: spring_app_classes
    kind: module
    confidence: 0.55
    filter: plausible_type_name
    strategy: regex
    gloss: Spring/Jakarta application class
    pattern: >-
      @(?:Service|RestController|Controller|Repository|Component|Dao)\b[^\n]*\n(?:\s*@[^\n]+\n)*\s*(?:public\s+|internal\s+|open\s+)?(?:class|object)\s+([A-Z][A-Za-z0-9_]*)
    flags: g
    name_group: 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: jpa_entity_class
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: JPA/Mongo/Room entity
    pattern: >-
      @(?:Entity|Document)\b[^\n]*\n(?:\s*@[^\n]+\n)*\s*(?:public\s+|internal\s+)?(?:class|data\s+class)\s+([A-Z][A-Za-z0-9_]*)
    flags: g
    name_group: 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: room_tablename
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: Room tableName
    pattern: '@Entity\s*\([^)]*tableName\s*=\s*["'']([^"'']+)["'']'
    flags: g
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: jpa_table_annotation
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: JPA @Table
    pattern: '@Table\s*\(\s*(?:name\s*=\s*)?["'']([^"'']+)["'']'
    flags: g
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .java
        - .kt
        - .kts
  - id: exposed_table
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: Exposed Table
    pattern: \bobject\s+([A-Z][A-Za-z0-9_]*)\s*:\s*Table\s*\(\s*"([^"]+)"\s*\)
    flags: g
    name_group: 1
    alias_groups:
      - 1
      - 2
    files:
      extensions:
        - .kt
        - .kts
  - id: hibernate_xml_mappings
    kind: model
    gloss: Hibernate mapping
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    pattern: <class\s+[^>]*\bname\s*=\s*["']([^"']+)["'][^>]*\btable\s*=\s*["']([^"']+)["']
    flags: gi
    name_template: '{1|class_leaf}'
    alias_groups:
      - 1
      - 2
    emit_extra_group_as_model: 2
    files:
      extensions:
        - .xml
  - id: hibernate_xml_table_name_first
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: Hibernate class
    pattern: <class\s+[^>]*\btable\s*=\s*["']([^"']+)["'][^>]*\bname\s*=\s*["']([^"']+)["']
    flags: gi
    name_template: '{2|class_leaf}'
    alias_groups:
      - 2
      - 1
    emit_extra_group_as_model: 1
    files:
      extensions:
        - .xml
  - id: jpa_orm_xml_entity
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: JPA orm.xml entity
    pattern: <entity\s+[^>]*\bclass\s*=\s*["']([^"']+)["']
    flags: gi
    name_template: '{1|class_leaf}'
    files:
      extensions:
        - .xml
  - id: jpa_orm_xml_table
    kind: model
    confidence: 0.55
    filter: plausible_model_name
    strategy: regex
    gloss: JPA orm.xml table
    pattern: <table\s+[^>]*\bname\s*=\s*["']([^"']+)["']
    flags: gi
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .xml
