# Python ecosystem harvester coverage.
# Primary manifest: pyproject.toml (uv/poetry/hatch/pdm). setup.py is fallback.

id: python
display_name: Python
status: implemented

package_manifests:
  - path: pyproject.toml
    format: pyproject_toml
    role: package
  - path: setup.cfg
    format: setup_cfg
    role: package
  - path: setup.py
    format: setup_py
    role: package

workspace:
  sources:
    - path: pyproject.toml
      # uv/poetry workspace member globs live under tool.uv.workspace / tool.poetry

frameworks:
  server:
    - fastapi
    - django
    - flask
    - starlette
    - litestar
    - aiohttp
    - tornado
    - sanic
    - quart
  frontend:
    - streamlit
    - gradio
    - dash
    - nicegui
    - panel
  cli:
    - click
    - typer
    - fire
    - argparse # stdlib — weak
    - cyclopts

kind_rules:
  - kind: service
    match:
      any_dependency_group: server
  - kind: surface
    match:
      any_dependency_group: frontend
  - kind: cli
    match:
      any_dependency_group: cli
  - kind: cli
    match:
      has_scripts_entry: true # [project.scripts]
  - kind: library
    match: {}

symbols:
  status: partial
  note: >
    Best-effort: *Service/*Controller classes → module; Django models.Model /
    SQLAlchemy Base / SQLModel / __tablename__ → model kind. Other symbols
    stay in tree-sitter code-index.
  planned: []

routes:
  status: partial
  note: >
    Best-effort regex harvest for FastAPI @app.get/post/…,
    APIRouter(prefix=) join, include_router prefix, Starlette/ASGI
    Route/Mount/add_route, Flask @app.route/@bp.route, Flask MethodView
    add_url_rule, Django path() with include() prefix join and app_name.
  planned_frameworks: []

app_classes:
  status: partial
  note: '*Service/*Controller/*Handler/*UseCase and Flask MethodView classes → module.'

models:
  status: partial
  note: >
    Django models.Model, SQLAlchemy Base/SQLModel/__tablename__, Peewee
    table_name, and Pydantic BaseModel → model.

# Executable tier-4 harvest rules (pattern-engine). Status/note above are summaries.
source_patterns:
  - id: fastapi_decorator_verbs
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: FastAPI/Starlette route
    pattern: '@(?:app|router|api_router|api)\.(get|post|put|patch|delete|options|head)\s*\(\s*[''"]([^''"]+)[''"]'
    flags: gi
    name_template: '{1|upper} {2}'
    files:
      extensions:
        - .py
  - id: fastapi_router_prefix_join
    kind: api
    gloss: FastAPI APIRouter prefix join
    filter: plausible_http_route
    strategy: router_group_prefix_join
    join_style: fastapi
    files:
      extensions:
        - .py
  - id: asgi_route_mount
    kind: api
    gloss: ASGI Route/Mount
    filter: plausible_http_route
    strategy: router_group_prefix_join
    join_style: asgi
    files:
      extensions:
        - .py
  - id: flask_route_decorator
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Flask route
    pattern: '@(?:app|bp|blueprint)\.route\s*\(\s*[''"]([^''"]+)[''"]'
    flags: gi
    name_group: 1
    files:
      extensions:
        - .py
  - id: flask_add_url_rule
    kind: api
    filter: plausible_http_route
    strategy: regex
    gloss: Flask add_url_rule
    pattern: \.add_url_rule\s*\(\s*['"]([^'"]+)['"]
    flags: g
    name_template: '{1|/}'
    files:
      extensions:
        - .py
  - id: flask_method_view_route
    kind: api
    filter: none
    strategy: regex
    gloss: Flask MethodView
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*)\s*\(\s*MethodView\s*\)
    flags: gm
    name_template: flask:{1}
    alias_groups:
      - 1
    files:
      extensions:
        - .py
  - id: django_include_join
    kind: api
    gloss: Django path/include join
    filter: plausible_http_route
    strategy: django_include_join
    files:
      extensions:
        - .py
  - id: django_app_name
    kind: api
    filter: none
    strategy: regex
    gloss: Django app_name
    pattern: \bapp_name\s*=\s*['"]([a-z][a-z0-9_]*)['"]
    flags: g
    name_template: django-app/{1}
    alias_groups:
      - 1
    files:
      extensions:
        - .py
  - id: python_app_suffix_classes
    kind: module
    filter: plausible_type_name
    strategy: regex
    gloss: Python application class
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*(?:Service|Controller|Handler|Presenter|UseCase|Interactor|ViewSet|APIView))\s*[\(:]
    flags: gm
    name_group: 1
    files:
      extensions:
        - .py
  - id: flask_method_view_module
    kind: module
    filter: plausible_type_name
    strategy: regex
    gloss: Flask MethodView
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*)\s*\(\s*MethodView\s*\)
    flags: gm
    name_group: 1
    files:
      extensions:
        - .py
  - id: python_orm_model_class
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: ORM model class
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*)\s*\(\s*(?:models\.Model|Base|db\.Model|SQLModel|Model|tortoise\.models\.Model)\s*\)
    flags: gm
    name_group: 1
    files:
      extensions:
        - .py
  - id: pydantic_sqlmodel_schema
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: Pydantic/SQLModel schema
    pattern: ^class\s+([A-Z][A-Za-z0-9_]*)\s*\(\s*(?:BaseModel|SQLModel)\s*\)
    flags: gm
    name_group: 1
    files:
      extensions:
        - .py
  - id: sqlalchemy_tablename
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: SQLAlchemy table
    pattern: __tablename__\s*=\s*['"]([^'"]+)['"]
    flags: g
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .py
  - id: peewee_table_name
    kind: model
    filter: plausible_model_name
    strategy: regex
    gloss: Peewee/ORM table_name
    pattern: table_name\s*=\s*['"]([^'"]+)['"]
    flags: g
    name_group: 1
    alias_groups:
      - 1
    files:
      extensions:
        - .py
