# Fly.io SERVING node for the kb chat demo (https://kb-demo.fly.dev).
#
# Low-budget, always-warm, and STATELESS: it holds no volume. On every boot it
# downloads every base's latest sha256-verified snapshot from Tigris (default via
# `start --from`, the rest via verified `import`) and warm-starts frozen
# (`--bootstrap-policy snapshot-only`) — no cloning, no indexing, no reindex
# scheduler. One process serves all bases; clients pick one with `X-KB-Base`
# (the chat demo's header picker). All the heavy work happens once a day on a
# separate 4GB builder machine, which publishes fresh per-base snapshots and
# rolls this node onto them.
#
# Because there is no durable volume and the index is verified on adopt, the
# served index cannot be torn or corrupted. Full model + setup:
#   FLY_ORCHESTRATION.md   ·   packages/kb-server/HANDOFF.md
#
# First-time setup (once):
#   fly storage create --app kb-demo                 # provisions Tigris → AWS_* + BUCKET_NAME secrets
#   fly secrets set -a kb-demo GEMINI_API_KEY=...
#   scripts/fly/refresh.sh (run once via the builder) to seed latest.json
#   fly deploy -a kb-demo

app = "kb-demo"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "38117"
  KB_HOME = "/data"
  KB_BASE = "kb"
  # Frozen serve: no git, no reindex. Refresh comes only from adopting a new
  # snapshot (published daily by the builder), never from in-process rescans.
  KB_SERVER_BOOTSTRAP_POLICY = "snapshot-only"
  # Pages + local `pnpm run demo` (http://localhost:8000 → this Fly host).
  KB_SERVER_ALLOWED_ORIGINS = "https://rosenjcb.github.io,http://localhost:8000"
  LOG_LEVEL = "info"
  # BUCKET_NAME + AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_ENDPOINT_URL_S3 come
  # from `fly storage create` as secrets — do not hard-code them here.

[http_service]
  internal_port = 38117
  force_https = true
  # Keep one machine warm — Pages chatbot hates cold starts. Run 2+ for a truly
  # zero-downtime daily swap (the builder rolls them one at a time).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # No HTTP service check: snapshot-only boot downloads + opens SQLite quickly,
  # but TCP liveness avoids blackholing the sole machine. /healthz is HTTP 200
  # when reachable (readiness — ok:true — is in the JSON body).

# No [[mounts]] — the serving node is stateless by design (source of truth is
# the snapshot in object storage). Nothing to corrupt on a volume.

# The heavy build lives on the 4GB builder, not here — but this node now holds
# up to 10 bases' worth of imported SQLite indexes at once (scripts/fly/bases.json),
# not the single `demo` base this was originally sized for. 256MB OOM-killed the
# machine mid-multi-base-import; bump this (not the builder) if it recurs.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["app"]

# Process up on :38117 (does not require /healthz 200).
# grace_period is long because boot now serially downloads + imports up to 10
# bases (see the [[vm]] comment above) before the default base starts and the
# port opens — a short grace period flags the machine unhealthy mid-import and
# flyctl deploy (see .github/workflows/fly-deploy.yml --wait-timeout) aborts
# the release even though the boot was still proceeding normally.
[checks]
  [checks.tcp]
    port = 38117
    type = "tcp"
    interval = "15s"
    timeout = "5s"
    grace_period = "12m"
