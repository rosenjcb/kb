# Fly.io app for kb-server (https://kb-demo.fly.dev).
# Build context is the repo root — same as `docker build -f packages/kb-server/Dockerfile .`
#
# First-time setup (once):
#   fly volumes create kb_data --region ams --size 5 --app kb-demo
#   fly secrets set -a kb-demo KB_SERVER_API_KEY=... GEMINI_API_KEY=...
#   fly deploy -a kb-demo
# Guide: packages/kb-server/FLY.md

app = "kb-demo"
primary_region = "ams"

[build]
  dockerfile = "packages/kb-server/Dockerfile"

[env]
  PORT = "38117"
  KB_HOME = "/data"
  KB_BASE = "demo"
  KB_GIT_REPOS = "https://github.com/rosenjcb/kb#main"
  KB_REINDEX_INTERVAL = "1h"
  # Pages chat demo (demo/ on GitHub Pages). Add more origins comma-separated if needed.
  KB_SERVER_ALLOWED_ORIGINS = "https://rosenjcb.github.io"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 38117
  force_https = true
  # Keep one machine warm — Pages chatbot hates cold starts mid-index.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5m"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

[[mounts]]
  source = "kb_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]
