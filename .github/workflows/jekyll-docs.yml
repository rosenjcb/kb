name: Jekyll docs

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/jekyll-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/jekyll-docs.yml"

concurrency:
  group: jekyll-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: docs/.ruby-version
          bundler-cache: true
          working-directory: docs

      - name: Jekyll build
        run: bundle exec jekyll build --strict_front_matter --trace

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
