name: Deploy Fly.io chat demo

# Redeploys the two Fly apps behind the chat demo whenever their server code
# changes on main. See FLY_ORCHESTRATION.md for the full model.
#
#   kb-demo (serving)         — plain `fly deploy`, safe: it has a normal
#                               [http_service] release process.
#   kb-demo-builder (builder) — build+push only, THEN destroy+recreate the
#                               scheduled machine explicitly. A plain
#                               `fly deploy` on an app with no
#                               [http_service]/[processes] instead creates or
#                               replaces a running machine using the image's
#                               default CMD, clobbering the scheduled
#                               machine's --schedule/refresh.sh command — see
#                               scripts/fly/deploy.sh, which this mirrors.
#                               A scheduled machine also pins its image *and*
#                               vm size at creation time, so recreating it is
#                               the only way it picks up either.
on:
  push:
    branches: [main]
    paths:
      - "packages/kb-core/**"
      - "packages/kb-client/**"
      - "packages/kb-server/**"
      - "Dockerfile.fly"
      - "fly.toml"
      - "fly.builder.toml"
      - "scripts/fly/**"

# Concurrency is per-job, NOT workflow-level. A single `fly-deploy` group meant a
# builder job hung on a cold build (twice observed running to GitHub's 6h ceiling)
# queued the *next* merge's whole run behind it — serving deploy included — so a
# merge could silently not reach kb-demo for hours and then surface as `cancelled`
# rather than a failure.

jobs:
  deploy-serving:
    name: Deploy kb-demo (serving)
    runs-on: ubuntu-latest
    # Newer main supersedes an in-flight release: the older image is already stale,
    # and `fly deploy` on an app with a normal [http_service] release process is
    # safe to interrupt — Fly either completed the release or rolls it back.
    concurrency:
      group: fly-deploy-serving
      cancel-in-progress: true
    # Boot serially imports up to 10 bases, hence the 15m --wait-timeout below;
    # this bounds the whole job so a wedged release cannot idle for 6h.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --wait-timeout: flyctl's default (5m) is shorter than the serving
      # node's boot, which now serially downloads + imports up to 10 bases
      # (scripts/fly/bases.json) before the port opens — see fly.toml's
      # [checks.tcp] comment. Without this, flyctl aborts the release while
      # the machine is still healthy but mid-import.
      - run: flyctl deploy -a kb-demo -c fly.toml --wait-timeout 15m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_KB_DEMO }}

  deploy-builder:
    name: Deploy kb-demo-builder (recreate scheduler)
    runs-on: ubuntu-latest
    # NOT cancel-in-progress, unlike serving: the recreate step destroys the
    # scheduled machine before running the new one, so a cancel landing inside that
    # window leaves the app with no scheduler at all and the nightly refresh stops
    # silently. Let a run finish; queue the next one behind it.
    concurrency:
      group: fly-deploy-builder
      cancel-in-progress: false
    # A cold build is slow but bounded (the toml allows COLD_BUILD_TIMEOUT=5400s).
    # Anything past this is wedged, not working — fail here instead of holding the
    # builder queue until GitHub's 6h ceiling kills the run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build + push image (no release — see header comment)
        run: flyctl deploy -a kb-demo-builder -c fly.builder.toml --build-only --push
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_KB_DEMO_BUILDER }}
      - name: Recreate the scheduled machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_KB_DEMO_BUILDER }}
        run: |
          set -euo pipefail
          scheduler_id="$(flyctl machine list -a kb-demo-builder --json | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const m = JSON.parse(s || "[]");
              process.stdout.write((m[0] && m[0].id) || "");
            });
          ')"
          if [ -n "$scheduler_id" ]; then
            flyctl machine destroy "$scheduler_id" -a kb-demo-builder --force
          fi
          # --region: `fly machine run` ignores fly.builder.toml's
          # primary_region too, so without this the scheduler is placed near
          # the GitHub runner instead of next to the serving app. Builder and
          # serving MUST share a region — a cross-region Tigris reader gets a
          # stale LIST view of a freshly published prefix (every key
          # head-objects 200 while `s3 cp --recursive` copies nothing) and the
          # demo crash-loops on "downloaded prefix … is incomplete". Read from
          # the toml so this can never drift from fly.toml's primary_region.
          builder_region="$(node -e '
            const fs = require("fs");
            const m = fs.readFileSync("fly.builder.toml", "utf8").match(/^\s*primary_region\s*=\s*"([^"]+)"/m);
            process.stdout.write(m ? m[1] : "");
          ')"
          if [ -z "$builder_region" ]; then
            echo "error: could not read primary_region from fly.builder.toml." >&2
            exit 1
          fi
          # --vm-size/--vm-memory must match fly.builder.toml's [[vm]] block —
          # `fly machine run` does NOT read it (see fly.builder.toml comment).
          # Previously shared-cpu-2x/4096 here diverged from performance-2x in
          # the toml; cold builds were then OOM-killed on whichever tier
          # actually got used. performance-4x/8192mb now matches on both.
          # -e COLD_BUILD_TIMEOUT: same non-inheritance problem for [env] —
          # without this it silently falls back to refresh.sh's own 1800s
          # default instead of the 5400s the toml declares.
          flyctl machine run . -c fly.builder.toml -a kb-demo-builder --detach \
            --region "$builder_region" \
            --vm-size performance-4x --vm-memory 8192 \
            -e COLD_BUILD_TIMEOUT=5400 \
            -e KB_EMBEDDER=gemini \
            --schedule daily --restart no \
            bash /app/scripts/fly/refresh.sh
