name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check for changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          # Pass if pending changeset files exist (pnpm version not yet run)
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null || true)
          if [ -n "$CHANGESETS" ]; then
            echo "✓ Changeset found: $CHANGESETS"
            exit 0
          fi
          # Also pass if CHANGELOG.md was added or modified in this PR (pnpm version was run inline)
          CHANGELOG_DIFF=$(git diff "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md | head -1)
          if [ -n "$CHANGELOG_DIFF" ]; then
            echo "✓ Version bump found (CHANGELOG.md updated in this PR)"
            exit 0
          fi
          echo "❌ No changeset found. Run 'pnpm version' to create one."
          exit 1
