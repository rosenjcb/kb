name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check for changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGESETS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^\.changeset/.+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$CHANGESETS" ]; then
            echo "❌ No changeset found in this PR."
            echo "   Run 'pnpm changeset' and commit the generated file."
            exit 1
          fi
          echo "✓ Changeset found:"
          echo "$CHANGESETS"
