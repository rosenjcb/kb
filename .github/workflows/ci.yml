name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Spec coverage (spec-md)
        run: pnpm run spec:check

      - name: Build
        run: pnpm run build

  # Dedicated, independently-named status check so it can be marked "Required" in branch
  # protection. The version bump is applied on the branch (`pnpm run changeset:version`), not
  # automatically after merge — this gate hard-fails a PR into main whose shipped source changed
  # without the affected package (kb / kb-server) being bumped, or that still carries an
  # unapplied changeset.
  changeset:
    name: Version bump required
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an applied version bump for source changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changeset-consistency.mjs --base "origin/$BASE_REF"
