# Tag + release on merge to main. Versioning happens ON the PR branch
# (`pnpm run changeset:version`), enforced by the merge gate in ci.yml.
# This workflow never opens PRs or re-runs versioning — it only fails if
# unconsumed changesets slipped onto main, then tags the current package version.
name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require consumed changesets (no post-merge versioning)
        run: node scripts/check-changeset-consistency.mjs --assert-no-pending

      - name: Tag release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
