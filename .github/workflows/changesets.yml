# Auto-PUBLISH on merge to main. Versioning is NOT automatic — it is a deterministic step
# run on the branch (`pnpm run changeset:version`) and enforced by the merge-to-main gate, so
# by the time code lands here the versions are already bumped and no changesets remain. With no
# pending changesets the changesets action goes straight to publish (tag + GitHub release). The
# `version` input is only a non-interactive safety net in case a changeset ever slips through.
name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish (versions already bumped on the branch)
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
