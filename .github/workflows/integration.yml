name: Integration test

# Pre-merge gate: runs on every PR into main, so the integration suite must pass on the
# feature branch before it can merge. (Mark the "Integration test" check as Required in
# branch protection for main to actually block the merge.) The pull_request event builds the
# PR merged into base, so this validates the post-merge state ahead of time.
# LLM is stubbed via WireMock (no repo secrets required today). Wire secrets here later if you
# switch the runner to a real provider.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Integration is expensive (Docker + WireMock); cancel superseded runs on the same PR.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration suite
        run: pnpm run integration:test
