name: Integration test

# Post-merge gate on main only — not on feature-branch pushes or PR CI.
# LLM is stubbed via WireMock (no repo secrets required today). Wire secrets
# here later if you switch the runner to a real provider on main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration suite
        run: pnpm run integration:test
