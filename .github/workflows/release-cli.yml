name: Release CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build And Publish CLI Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run type-check
          pnpm run build

      - name: Pack npm artifact
        run: npm pack

      - name: Rename release package
        run: |
          PACKAGE="$(ls kb-*.tgz | head -n 1)"
          mv "$PACKAGE" kb-cli-node24.tgz

      - name: Prepare bootstrap installer
        run: |
          cp scripts/install-release.sh install-kb.sh
          chmod +x install-kb.sh

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Versioned release published via Changesets (v*.*.*).
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="KB CLI ${TAG_NAME}"
            PRERELEASE="false"
          else
            # Rolling build for every push to main, named after the current
            # (Changesets-managed) version so the changeset version is visible.
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG_NAME="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_NAME="KB CLI v${PKG_VERSION} (build ${SHORT_SHA})"
            PRERELEASE="false"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "pkg_version=${PKG_VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changeset notes
        id: notes
        shell: bash
        run: |
          # Pull the latest CHANGELOG section (changeset-generated notes) for the
          # current version so the release body reflects what changed.
          NOTES="$(node scripts/extract-changelog.mjs "${{ steps.meta.outputs.pkg_version }}")"
          {
            echo 'changelog<<EOF'
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "_No changeset notes recorded for this version._"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb-cli-node24
          path: |
            kb-cli-node24.tgz
            install-kb.sh

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            kb-cli-node24.tgz
            install-kb.sh
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            KB CLI **v${{ steps.meta.outputs.pkg_version }}** — CI-built package for Node 24+.

            ## What's changed (changeset notes)

            ${{ steps.notes.outputs.changelog }}

            ---

            Install on a fresh machine with:
            `curl -fsSL https://github.com/rosenjcb/kb/releases/latest/download/install-kb.sh | bash`

            Upgrade an existing install with:
            `kb sync`
