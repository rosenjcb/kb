name: Release CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build And Publish CLI Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run type-check
          pnpm run build

      - name: Pack npm artifact
        run: npm pack

      - name: Rename release package
        run: |
          PACKAGE="$(ls kb-*.tgz | head -n 1)"
          mv "$PACKAGE" kb-cli-node22.tgz

      - name: Prepare bootstrap installer
        run: |
          cp scripts/install-release.sh install-kb.sh
          chmod +x install-kb.sh

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="KB CLI ${TAG_NAME}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG_NAME="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_NAME="KB CLI main build ${SHORT_SHA}"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb-cli-node22
          path: |
            kb-cli-node22.tgz
            install-kb.sh

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          files: |
            kb-cli-node22.tgz
            install-kb.sh
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            CI-built KB CLI package for Node 22+.

            Install on a fresh machine with:
            `curl -fsSL https://github.com/rosenjcb/kb/releases/latest/download/install-kb.sh | bash`

            Upgrade an existing install with:
            `kb sync`
