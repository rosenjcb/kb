name: Release packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish client + server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run type-check
          pnpm run build

      - name: Build client runtime artifact
        run: node scripts/build-release-runtime.mjs client .

      - name: Build server runtime artifact
        run: node scripts/build-release-runtime.mjs server .

      - name: Prepare bootstrap installer
        run: |
          cp scripts/install-release.sh install-kb.sh
          chmod +x install-kb.sh

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          CLIENT_VERSION="$(node -p "require('./packages/kb-client/package.json').version")"
          SERVER_VERSION="$(node -p "require('./packages/kb-server/package.json').version")"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="KB ${TAG_NAME} (client + server)"
            PRERELEASE="false"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG_NAME="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_NAME="KB v${CLIENT_VERSION} client + v${SERVER_VERSION} server (build ${SHORT_SHA})"
            PRERELEASE="false"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "client_version=${CLIENT_VERSION}"
            echo "server_version=${SERVER_VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changeset notes
        id: notes
        shell: bash
        run: |
          CLIENT_NOTES="$(node scripts/extract-changelog.mjs "${{ steps.meta.outputs.client_version }}" client)"
          SERVER_NOTES="$(node scripts/extract-changelog.mjs "${{ steps.meta.outputs.server_version }}" server)"
          {
            echo 'changelog<<EOF'
            echo "### @kb/client v${{ steps.meta.outputs.client_version }}"
            if [ -n "$CLIENT_NOTES" ]; then
              echo "$CLIENT_NOTES"
            else
              echo "_No changeset notes recorded for this client version._"
            fi
            echo ""
            echo "### @kb/server v${{ steps.meta.outputs.server_version }}"
            if [ -n "$SERVER_NOTES" ]; then
              echo "$SERVER_NOTES"
            else
              echo "_No changeset notes recorded for this server version._"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb-release-node24
          path: |
            kb-client-node24.tgz
            kb-server-node24.tgz
            install-kb.sh

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            kb-client-node24.tgz
            kb-server-node24.tgz
            install-kb.sh
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            KB release — **@kb/client v${{ steps.meta.outputs.client_version }}** and **@kb/server v${{ steps.meta.outputs.server_version }}** (Node 24+).

            ## Artifacts

            | Asset | Role |
            |-------|------|
            | `kb-client-node24.tgz` | `kb` CLI/TUI |
            | `kb-server-node24.tgz` | `kb-server` daemon |
            | `install-kb.sh` | One-shot installer (both by default; `--client-only` / `--server-only`) |

            ## What's changed (changeset notes)

            ${{ steps.notes.outputs.changelog }}

            ---

            Install both on a fresh machine:
            `curl -fsSL https://github.com/rosenjcb/kb/releases/latest/download/install-kb.sh | bash`

            Upgrade an existing install:
            `kb sync`
