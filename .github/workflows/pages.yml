name: Deploy chat demo to GitHub Pages

# Publishes the static "try it" chat page in `demo/` to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Bake the server URL into demo/config.js
        # The chat page talks to ONE baked kb-server. Override the committed
        # default (https://kb-demo.fly.dev) by setting the `KB_DEMO_SERVER_URL`
        # repo variable; otherwise the committed default ships unchanged.
        env:
          KB_DEMO_SERVER_URL: ${{ vars.KB_DEMO_SERVER_URL }}
        run: |
          if [ -n "${KB_DEMO_SERVER_URL}" ]; then
            printf "window.__KB_SERVER__ = '%s'\n" "${KB_DEMO_SERVER_URL}" > demo/config.js
            echo "Baked KB_DEMO_SERVER_URL=${KB_DEMO_SERVER_URL} into demo/config.js"
          else
            echo "No KB_DEMO_SERVER_URL variable set — shipping the committed demo/config.js default."
          fi
      - name: Upload demo/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
