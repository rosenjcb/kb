answers:
  - >
    Kestra is an open-source, event-driven orchestration platform for data, AI, and infrastructure
    workflows. A Flow is a declarative YAML definition living in a Namespace; it composes Tasks
    (units of work, often plugin-backed) and optional Triggers (schedule or event) that create
    Executions. Labels, inputs, outputs, retries, and error handlers structure resilience. The same
    flow can be authored from the UI or as code; the product treats YAML as the source of truth.
  - >
    The monorepo splits runtime concerns into modules such as webserver (HTTP/API + UI hosting),
    executor (orchestrates execution graphs), worker (runs task workloads), scheduler (evaluates
    triggers / schedules), indexer (search/index of executions and flows), jdbc-* persistence
    backends, cli (server entrypoints), and ui (Vue/TypeScript front-end). Together they form the
    product: author in UI/YAML, persist flows, schedule or manually run executions, and observe
    results.
  - >
    The UI embeds a flow editor that edits the declarative YAML and renders a visual graph of tasks
    and topology. Changes in the visual builder rewrite the YAML (and vice versa) so the stored
    flow definition stays declarative even when operators drag tasks, set properties, or use the
    code pane. Validation/autocomplete in the editor reflect the flow schema and available plugin
    task types.
  - >
    Execute in the UI issues an API call to the webserver to create an Execution for the flow
    (with any inputs). Persistence records the execution; the executor expands the flow graph into
    runnable tasks and dispatches work. Workers claim and run tasks (including plugin tasks),
    reporting state transitions. The UI polls or streams execution status so the operator sees
    running/success/failed tasks without leaving the console.
  - >
    Plugins package additional task (and often trigger) types. They register with Kestra’s plugin
    system so the runtime can instantiate them by type id in YAML. Once loaded, those types appear
    in UI task pickers and editor completion lists; selecting a plugin task in the UI writes the
    corresponding type/properties into the flow YAML that the executor later resolves.
  - >
    Saving a trigger on a flow persists it with the flow definition. The scheduler component
    evaluates schedule/event triggers, and when conditions match it creates a new Execution the
    same way a manual UI run would. UI edits to cron expressions, conditions, or disabled flags
    therefore change what the scheduler will fire on subsequent ticks.
  - >
    Flow Inputs parameterize a run (collected in the Execute dialog); task Outputs and flow-level
    outputs are artifacts the UI surfaces after completion. The execution view (Gantt/timeline plus
    per-task logs) lets operators drill from a failed node to stdout/stderr and output values —
    closing the loop from “click Execute” to inspectable results.
  - >
    The CLI entrypoint (`kestra server local` via the published image/binary) starts an all-in-one
    local mode that wires webserver, executor, worker, and scheduler together against local
    storage/DB defaults so the UI on the exposed port can author and run flows without a full
    multi-service deploy. Docker quickstart mounts storage and optionally the Docker socket for
    tasks that need it.
  - >
    `ExecutionController` (`@Controller("/api/v1/{tenant}/executions")`) is the Micronaut
    webserver API for execution search/get/create/restart and related HTTP operations. A correct
    answer must land on that Java controller — not only the product noun "execution" — and must
    not confuse it with the executor/worker runtime process.
  - >
    `ConcurrencyLimitController` is the webserver API around concurrency limits (adjacent to
    execution lifecycle). A correct answer distinguishes that API controller from
    executor/worker behavior and must not discuss kb inquiry lanes or length gates.
  - >
    The "Import" action in the new-flow editor (`FlowCreate.vue`) is entirely client-side:
    `handleImportSubmit` calls `initialize(undefined, undefined, yaml)`, which runs
    `setupFlow`, which sets `flowYaml = importYaml` directly into local component/editor
    state. No API call is made — the flow is not created or persisted on the backend at
    import time. It's only saved when the user separately triggers Save. A correct answer
    must not describe import as calling a create/save/bulk-import backend endpoint (that's
    the unrelated `ImportFlowsData` `/api/v1/{tenant}/flows/import` bulk feature, not this
    path).
  - >
    Same mechanism as above, from the UI-location angle: the Import button/dialog in the
    new-flow editor (`ImportYaml.vue`, wired into `FlowCreate.vue` via `handleImportSubmit`)
    only sets parsed YAML into local editor/component state (`flowYaml = importYaml`). It
    does not call the create/save flow API. A correct answer must not claim it calls a
    dedicated create/save or bulk-import API.
  - >
    `handleImportSubmit` in `FlowCreate.vue` calls `initialize(undefined, undefined, yaml)`
    → `setupFlow`, setting local `flowStore` state from the imported YAML — it does not
    itself save or otherwise change the availability of the Save action in
    `MultiPanelFlowEditorView.vue`. The Save button/shortcut remains exactly as available as
    it is for any newly-created (unsaved) flow; the bug is that nothing about the import path
    triggers a save, not that it disables one. A correct answer should not need to hedge or
    fabricate mechanisms (e.g. focus/blur handling, router redirects) not actually present in
    the retrieved sources.
