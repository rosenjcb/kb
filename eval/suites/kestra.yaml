questions:
  - "What is Kestra, and how do flows relate to namespaces, tasks, and triggers in its product model?"
  - "Which top-level modules (webserver, executor, worker, scheduler, cli, ui, …) make up the Kestra distribution, and what is each responsible for?"
  - "How does the built-in UI workflow editor keep the on-screen graph synchronized with the declarative YAML flow definition?"
  - "Step by step, what happens when a user clicks Execute on a flow in the UI: which API/server components receive the request, how is an Execution created, and how do executor/worker pick up tasks?"
  - "Explain how plugins extend Kestra tasks and how a plugin task type becomes available for selection in the UI palette / YAML autocomplete."
  - "Infer the path from editing a trigger (schedule or event) in the UI to the scheduler actually firing a new execution."
  - "What are inputs, outputs, and the UI execution Gantt/logs views for — how do task results surface back to the operator after a run?"
  - "How does Kestra support starting a local all-in-one server from the CLI (e.g. server local), and which components does that mode wire together?"
  # Alias / landing probes — product questions, not kb internals.
  - What is the role of the execution controller in the Kestra webserver API?
  - How does the concurrency-limit controller relate to executions, queues, workers, and the UI run console end-to-end, and what does that API own?
  # Import-YAML-doesn't-save regression probes (issue #216/#220/#223 root-cause session)
  - "When a user creates a new flow and imports YAML via the \"Import\" action in the flow editor, what code path handles the import, and why might the flow not actually be persisted/saved to the backend after import?"
  - "Where in the Vue UI is the flow \"Import\" feature implemented (the button/dialog that lets a user paste or upload YAML for a new flow), and what does it do with the parsed YAML — does it call the create/save flow API or just set the editor content?"
  - "In MultiPanelFlowEditorView.vue and the flow store, how does clicking Save behave when flowStore.isCreating is true, and could the YAML import path (FlowCreate.vue handleImportSubmit / setupFlow) leave the flow store in a state where the Save button is missing, disabled, or a no-op?"
