# Vendor question pack for `kb` eval harness. Use: --suite fzf
# Schema: eval/suites/README.md (or see loadVendorSuite in scripts/eval-run.mjs)
schema_version: 1
id: fzf
display_name: fzf
repo_url: https://github.com/junegunn/fzf.git
rubric_focus: the **fzf** Go fuzzy-finder knowledge base (documents + symbols in SQLite)
questions:
  - What is fzf for, and what are its main capabilities and use cases?
  - How does fzf's architecture work, including major packages and how the fuzzy matching core relates to the TUI and shell integration?
  - How do I install and build fzf, including platform support and build systems?
  - What fuzzy matching algorithm and scoring scheme does fzf use?
  - How does fzf integrate with shells (bash, zsh, fish) and editors like Vim/Neovim?
  - What are the key flags and configuration options available to users?
  - What are the main gotchas, constraints, and known limitations of fzf?
  - What does the changelog say about recent version history and notable changes?
  # Alias / landing probes — product questions about fzf, not kb internals.
  - What is the role of fzf when a shell widget or pipeline needs interactive fuzzy selection?
  - How does fzf fit together end-to-end: fuzzy matching, TUI rendering, shell key-bindings, and editor integration?
answers:
  - >
    fzf is a general-purpose command-line fuzzy finder and interactive terminal toolkit, distributed
    as a single portable Go binary. It reads a list of lines from stdin (or, absent a pipe, walks the
    filesystem via its own fastwalk-based traversal), lets the user narrow the list interactively with
    fuzzy queries, and writes the selected line(s) to stdout. Beyond simple filtering it works as a
    building block for shell and editor workflows: multi-select (`-m`), preview windows, key/event
    bindings (`--bind`) that can reload, transform, or `become` another process, and a client/server
    mode (`--listen`) for external control. Common use cases include fuzzy file/history/process
    pickers via shell integration (CTRL-T, CTRL-R, ALT-C), fuzzy completion, git/branch/log pickers,
    interactive ripgrep-driven search, and custom terminal UIs (menus, dashboards) built entirely from
    shell scripts.
  - >
    fzf's Go module (`github.com/junegunn/fzf`) is organized under `src/`: `core.go` wires the pipeline
    together via `Run(opts *Options)`, connecting a `Reader` (reader.go, reads stdin or runs
    `$FZF_DEFAULT_COMMAND`/`--walker` via fastwalk, pushing items into a `ChunkList`), a `Matcher`
    (matcher.go, partitions chunks across `runtime.NumCPU()` goroutines and calls into `src/algo` for
    scoring), and a `Terminal` (terminal.go, ~8500 lines, owns rendering, input handling, key/event
    binding execution, and the preview window). Events flow through an `EventBox` in a documented
    loop: Reader emits EvtReadNew/EvtReadFin, Matcher emits EvtSearchProgress/EvtSearchFin, and
    Terminal reacts by redrawing. The TUI layer (`src/tui`) abstracts two renderers behind a common
    interface — `tui/tcell.go` (build tag `tcell || windows`, used on Windows and as a fallback) and
    `tui/light.go` (the default on Unix, a lightweight raw-termios/ANSI renderer) — so `algo`, matching,
    and event plumbing are independent of how cells are actually painted. Shell integration (`shell/`)
    and the Vim plugin are external clients that simply invoke the built binary with specific flags
    and read its stdout.
  - >
    fzf requires Go 1.23+ to build from source; `BUILD.md` documents `make` (builds the binary for the
    current platform into `target`), `make install` (copies it to `bin/`), `make build` (cross-platform
    archives via goreleaser), and `make test`/`make itest` (Go unit tests and tmux-based integration
    tests via `test/runner.rb`). Version/revision strings are derived from git, so out-of-tree builds
    must set `$FZF_VERSION`/`$FZF_REVISION` manually. Prebuilt binaries and packages are available for
    macOS/Linux/Windows/BSD through Homebrew, MacPorts, mise, most Linux package managers (apt, dnf,
    pacman, apk, nix, etc.), and Windows managers (Chocolatey, Scoop, Winget, MSYS2). The `install`
    script (bash) or `git clone --depth 1 ... ~/.fzf && ~/.fzf/install` sets up the binary plus shell
    integration, with flags like `--bin`, `--all`, `--xdg`, `--[no-]key-bindings`, `--[no-]completion`;
    a separate `install.ps1` handles Windows/PowerShell setup. Key third-party Go dependencies are
    rivo/uniseg, mattn/go-shellwords, mattn/go-isatty, gdamore/tcell, and charlievieth/fastwalk.
  - >
    The core matching logic lives in `src/algo/algo.go`, which implements two algorithms: `FuzzyMatchV1`
    finds the first fuzzy occurrence in O(n) then scans backward for a shorter match, while the default
    `FuzzyMatchV2` (selectable/deselectable via `--algo=v1`) implements a modified Smith-Waterman local-
    alignment algorithm that finds the globally optimal-scoring match in O(nm) — unlike the original
    algorithm, character omission/mismatch in the pattern is not allowed. Scoring is built from constants
    `scoreMatch = 16`, `scoreGapStart = -3`, and `scoreGapExtension = -1`, plus positional bonuses:
    `bonusBoundary` for word-boundary starts, extra `bonusBoundaryWhite`/`bonusBoundaryDelimiter` after
    whitespace or path/`,`/`:`/`;`/`|` delimiters, `bonusCamel123` for camelCase/letter-digit transitions,
    a `bonusFirstCharMultiplier` doubling the bonus if the pattern's first character lands on a special
    position, and `bonusConsecutive` rewarding unbroken matching runs. `algo.Init(scheme)` switches
    between `default`, `path`, and `history` scoring schemes (e.g. `path` treats `/` as the primary
    delimiter and de-emphasizes whitespace boundaries), and `normalize.go` handles Unicode normalization
    for matching.
  - >
    Shell integration is generated by fzf itself (`fzf --bash`, `fzf --zsh`, `fzf --fish`, and
    `fzf --nushell`) or sourced from static scripts in `shell/` (`key-bindings.bash`/`.zsh`/`.fish`/`.nu`
    and `completion.bash`/`.zsh`/`.fish`/`.nu`, with shared logic factored into `common.sh`). These wire
    up CTRL-T (paste selected files/dirs, driven by `--walker file,dir,follow,hidden` and
    `$FZF_CTRL_T_COMMAND`/`$FZF_CTRL_T_OPTS`), CTRL-R (fuzzy history search, `$FZF_CTRL_R_OPTS`), and
    ALT-C (cd into a selected directory, `$FZF_ALT_C_COMMAND`/`$FZF_ALT_C_OPTS`) as shell widgets (e.g.
    fish's `fzf-file-widget`, `fzf-history-widget`, `fzf-cd-widget` bound to `\ct`/`\cr`/`\ec` in
    `key-bindings.fish`), plus `**<TAB>` fuzzy path/variable/PID/hostname completion via
    `fzf_compgen_path`/`fzf_compgen_dir` hooks. Editor integration is external: `junegunn/fzf` ships Vim
    helper functions like `fzf#install()` and `fzf#run()` (documented in `README-VIM.md`), while richer
    commands (`:Files`, `:Rg`, `:Buffers`, etc.) live in the separate `junegunn/fzf.vim` plugin installed
    alongside it via vim-plug; Neovim/Lua users are pointed to the third-party `fzf-lua` project instead.
  - >
    Users configure fzf primarily through command-line flags parsed in `src/options.go` (nearly 4000
    lines), many of which mirror `$FZF_DEFAULT_OPTS`/`$FZF_DEFAULT_OPTS_FILE`. Search behavior is
    controlled by `-x`/`--extended` (default extended-search syntax with `^prefix`, `suffix$`, `!not`,
    `'exact`, and `|` OR terms), `-e`/`--exact`, `--algo`, `--scheme`, `--tiebreak`, `-i`/`--ignore-case`,
    and `--nth`/`--with-nth`/`-d`/`--delimiter` for field-limited matching. Interaction and layout use
    `-m`/`--multi`, `--bind` (the event/action mini-language driving reload, transform, become, execute,
    etc.), `--height`, `--popup`, `--layout` (default/reverse/reverse-list), `--border`, `--style`
    (`default`/`full`/`minimal` presets), `--color`, `--prompt`, `--pointer`/`--marker`. Output/preview
    flags include `--preview`, `--preview-window`, `--print0`/`--read0`, `--print-query`, `-q`/`--query`,
    and `-1`/`--select-1`/`-0`/`--exit-0` for scripting. The full, authoritative list is documented in
    the man page (`fzf --man`).
  - >
    A few gotchas recur in fzf's own docs and changelog: `--algo=v2` (Smith-Waterman-style) is O(nm) and
    slower than the O(n) `v1` algorithm, so very large inputs or slow terminals may need `v1` or
    exact-match mode for responsiveness; a 32-bit integer-overflow panic in `FuzzyMatchV2` was only fixed
    in 0.73.0. `$FZF_CURRENT_ITEM`/`{}` placeholders can overflow `ARG_MAX` or break on NUL
    bytes, so fzf now skips exporting items over 64KB or containing NUL. `--popup` silently does nothing
    outside tmux 3.3+/Zellij 0.44+, and `FZF_DEFAULT_COMMAND` is deliberately NOT used by CTRL-T/ALT-C
    (they use their own `$FZF_CTRL_T_COMMAND`/`$FZF_ALT_C_COMMAND`), a frequent source of confusion.
    Custom `FZF_CTRL_R_COMMAND` overrides are not yet supported. fzf.vim/Vim integration and Neovim
    Lua users depend on separate third-party plugins (fzf.vim, fzf-lua) rather than in-tree code. Holding
    large amounts of preview/log output can consume significant memory, and out-of-tree builds without
    git metadata must manually set `$FZF_VERSION`/`$FZF_REVISION` or `fzf --version` misreports itself.
  - >
    The CHANGELOG shows fzf at 0.74.0, with recent releases adding tmux/Zellij-aware `--popup` behavior
    (floating panes on tmux 3.7+ instead of modal popups, implying `border-native`), a `result-final`
    bind event distinct from `result` for one-shot end-of-stream actions, a `wait` bind action to block
    until search completion, and default `alt-left`/`alt-right` word-motion bindings. 0.73.1 fixed an
    O(n^2) HTTP body-accumulation bug in `--listen` that could stall the server for ~8s on a ~390KB
    request, and skipped exporting `$FZF_CURRENT_ITEM` for NUL-containing items. 0.73.0 added Nushell
    integration (`fzf --nushell`), a `--preview-window=next` position, timer-driven `every(N)` bind
    events with `$FZF_IDLE_TIME`/`$FZF_IDLE_TIME_MS`, and fixed a 32-bit integer-overflow panic in
    `FuzzyMatchV2` plus a UTF-8 C1 control-character injection issue. 0.72.0 added `inline` header/footer
    border styles that merge into the list frame's border. Across versions the changelog consistently
    pairs new `--bind` actions/events with targeted scoring and rendering bug fixes.
  - >
    Land on the **fzf** CLI/product: read lines (stdin or walker), interactive fuzzy filter,
    write selection(s) to stdout — including shell widgets (CTRL-T/R, ALT-C) and completion. A
    correct answer must describe that interactive-filter role. This suite's registry is thin
    (cli/library aliases for fzf, no CamelCase modules); do not invent harvested class entities
    or treat "role" as a schema concept.
  - >
    End-to-end fzf is: `FuzzyMatchV2` / algo scoring on an input list, a terminal TUI that
    filters that list interactively, shell widgets (CTRL-T/R, ALT-C and `**<TAB>` completion)
    generated by `fzf --bash`/`--zsh`/`--fish`, and editor helpers (`fzf#run` in-tree; fzf.vim
    / fzf-lua out of tree). A correct answer covers matching + TUI + shell/editor integration
    as one product, without kb inquiry-lane or length-gate language, and without inventing
    CamelCase module entities this thin registry does not harvest.
