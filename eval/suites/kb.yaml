# kb repo / dogfood question pack. Use: --suite kb
schema_version: 1
id: kb
display_name: kb
repo_url: https://github.com/rosenjcb/kb.git
rubric_focus: the **kb** local-first knowledge CLI/repo
questions:
  - What problem does kb solve, and what is the normal workflow for creating, refreshing, and querying a knowledge base?
  - What are the main phases of kb init, and what kinds of data does each phase add to the local store?
  - How does kb scan refresh an existing base, and how is that different from creating a base with kb init?
  - How are markdown documents turned into import_doc facts during init or scan?
  - How does code indexing work at a high level, including the role of the tree-sitter indexer?
  - How does kb query retrieve evidence from facts, FTS/vector scoring, and graph relationships?
  - How are kb skills packaged and installed into supported agent environments?
  - How does the eval runner exercise kb, from suite selection through init/scan/query and automatic scoring?
  - Does kb send my repository's code or documents to a remote server to build the knowledge base, or does indexing happen locally?
  - What is the default maximum number of passes for the deep facts-query retrieval loop, and which environment variable overrides it?
  - How do I use kb to provision and deploy a Kubernetes cluster for my application?
  - At what retrieved-fact pool size does the fact curator start running, and what happens to facts the judge does not keep?
answers:
  - >
    kb is a local-first knowledge CLI for turning a repository into a queryable SQLite-backed
    knowledge base. A typical workflow is: create a base with `kb init --git <repo>`, refresh the
    tracked repos later with `kb scan`, and ask natural-language questions with `kb query`. Bases can
    track one or more git repos and are managed with `kb base` and `kb base repo` commands. The
    supporting commands expose the indexed facts, documents, graph, publishing, and installed skills,
    but the core user loop is init, scan, query.

  - >
    `kb init` clones or registers the requested git repo(s), creates a session directory for the
    base, and runs checkpointed indexing phases. The read-inputs phase discovers markdown and useful
    repo signals. The code-index phase writes import_code facts and code relationships from AST
    indexers. The document-facts phase segments markdown into deterministic import_doc facts. The
    import-docs/write phases preserve original markdown documents in the local SQLite store. For
    multi-repo bases, kb also records repo provenance and reconciles cross-repo relationships so the
    graph can connect facts across repos.

  - >
    `kb scan` refreshes an existing base rather than creating one. It works over the repos already
    tracked by the base, pulls or syncs them, detects changed source/code files by stored state such
    as content hashes, and re-runs the relevant indexing work. Use `kb init --git <url>` to create a
    new base, `kb scan` for routine refreshes, and `kb base repo add` or `kb base repo remove` to
    change which repos belong to an existing base.

  - >
    Markdown fact ingest is deterministic. `scan-fact-ingest` reads markdown source files, strips OKF
    frontmatter when present, splits the body into sentence-like segments, and upserts each segment
    as an import_doc fact with a stable source reference such as `path.md#s0`. During init/scan this
    happens after code facts are available, so doc segments can optionally be anchored to relevant
    exported symbols. Existing segment facts for a changed file are purged or tombstoned before the
    file is re-ingested so removed text does not linger in retrieval.

  - >
    Code indexing is deterministic and does not depend on an LLM. Every language — including
    TypeScript/JavaScript — goes through a single `TreeSitterIndexer` (`src/tools/tree-sitter-indexer.ts`)
    that parses one file at a time with a WASM grammar (`web-tree-sitter`), so peak memory is bounded by
    the largest file rather than the whole project. It writes import_code facts for symbols, imports, and
    structural relationships (including constant-value and EXTENDS/IMPLEMENTS edges), and records a
    per-file content_hash in `code_file_state` to skip unchanged code on future scans. Languages without
    a wired WASM grammar are simply not indexed — there is no LLM fallback. The resulting code facts can
    participate in graph edges and doc-fact anchoring.

  - |
    `kb query` is facts-first: it retrieves fact rows plus graph context, then asks the model to
    answer from that evidence. Retrieval blends several signals:

    - **Lexical** — SQLite FTS over the `facts` table.
    - **Semantic** — deterministic embedding/vector-style scoring (a lexical proxy, not neural embeddings).
    - **Graph** — neighbor expansion over `fact_edges`, with repo-aware ordering for multi-repo bases.
    - **Query expansion** — related terms drawn from graph and fact relationships before search.

    The output reports a retrieval method (such as **hybrid facts-loop retrieval**), the number of
    facts considered, provenance ids, and the final synthesized answer.

  - >
    kb skills are authored as markdown skill documents in the repository. The build process copies
    bundled skills next to the CLI artifact so they can be loaded in packaged installs, while dev
    mode can load from the source tree. The skill installer writes appropriate files into supported
    agent environments such as Claude Code, Cursor, Codex, and Copilot, using content hashes so
    installs are repeatable and only update when skill content changes.

  - |
    `npm run eval` invokes the eval runner over a YAML suite. The run proceeds in stages:

    - **Resolve repo** — clone or locate the target repository named by the suite.
    - **Ensure base** — run `kb init` when no base exists, then `kb scan` to refresh.
    - **Ask questions** — pose each suite question with `kb query` and save per-question outputs.
    - **Auto-score** — optionally call a judge model (such as Gemini or OpenAI) to grade
      correctness, usefulness, relevance, specificity, and evidence handling.

    The artifact records the run directory, base, suite, query results, scores, telemetry, and
    trend information for later comparison.

  - >
    Indexing is local-first. `kb init` and `kb scan` clone/read the repo and build a local
    SQLite base (`.kb-index.sqlite`) on your machine; code indexing (tree-sitter AST) and markdown
    doc-fact ingest are deterministic and run with no LLM and no upload of your source. The only
    outbound network calls are to the LLM provider you configure, and only at query time for answer
    synthesis (plus any optional embedding/judge steps) — not a bulk transfer of your code or docs.
    With no provider key, retrieval still works locally; only the synthesized natural-language answer
    is unavailable. A correct answer should state that indexing is local and name the one exception
    (provider calls during synthesis), not claim the whole repo is sent to a server.

  - >
    The deep facts-query retrieval loop defaults to a maximum of 24 passes, overridden by the
    `KB_FACTS_QUERY_MAX_ITERS` environment variable (clamped 1–24; `-1` lifts it toward the absolute
    safety cap of 512 passes). It is one of three deep-loop knobs: the others are
    `KB_FACTS_QUERY_MAX_HOPS` (graph hops, default 20) and `KB_FACTS_QUERY_MAX_PONDS` (exploration
    ponds, default 6). A correct answer must give the number 24 and the `KB_FACTS_QUERY_MAX_ITERS`
    variable specifically, not a vague "it is configurable."

  - >
    This is out of scope for kb. kb is a local-first knowledge CLI that indexes a repository into a
    queryable SQLite knowledge base (`kb init` / `kb scan` / `kb query`) and installs agent skills; it
    does not provision infrastructure, run deployments, or manage Kubernetes clusters. A correct answer
    should say so plainly rather than inventing a deploy workflow. The most kb could do is answer
    questions about Kubernetes manifests that already exist inside an indexed repository — it has no
    cluster-provisioning capability of its own.

  - >
    The fact curator runs only when the retrieved pool exceeds 12 facts
    (`DEFAULT_MIN_RESULTS_TO_CURATE`). Facts with high token overlap are auto-kept with no LLM call;
    the remainder go to a single structured judge verdict (`{keep, gaps, sufficient}`) keyed on the
    raw user question. Facts the judge does not keep are hard-dropped — there is no 15% floor. When the
    judge reports gaps and the set is not yet sufficient, the curator issues bounded shallow
    re-discovery queries (excluding what is already known) to refill those gaps. It fails safe to the
    unfiltered pool on any LLM/parse error and guards against ever returning an empty set. Curator
    decisions are recorded out-of-band on `retrieval.curation` and are not injected into the synthesis
    context.
