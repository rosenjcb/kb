# kb repo / dogfood question pack. Use: --suite kb
schema_version: 1
id: kb
display_name: kb
repo_url: https://github.com/rosenjcb/kb.git
rubric_focus: the **kb** local-first knowledge CLI/repo
questions:
  - What problem does kb solve, and what is the normal workflow for setting up indexing and querying a knowledge base?
  - What are the main phases when kb-server boot-builds or refreshes a knowledge base, and what kinds of data does each phase add to the local store?
  - How does a scan refresh an existing base, and how is that different from the initial bootstrap that creates a base?
  - How are markdown documents turned into import_doc facts during indexing?
  - How does code indexing work at a high level, including the role of the tree-sitter indexer?
  - How does kb query retrieve evidence from facts, FTS/vector scoring, and graph relationships?
  - How are kb skills packaged and installed into supported agent environments?
  - How does the eval runner exercise kb, from suite selection through indexing, query harvest, and automatic scoring?
  - Does kb send my repository's code or documents to a remote server to build the knowledge base, or does indexing happen locally?
  - What is the default maximum number of passes for the deep facts-query retrieval loop, and which environment variable overrides it?
  - How do I use kb to provision and deploy a Kubernetes cluster for my application?
  - At what retrieved-fact pool size does the fact curator start running, and what happens to facts the judge does not keep?
  - Walk through a single kb query in order, from the deep retrieval loop to the final answer — what does each stage (retrieval orchestrator, sufficiency judge, fact curator, synthesis) receive and produce?
  - Step by step, how does one interactive chat turn work, from the user's message through retrieval to the synthesized reply?
  - How would I add support for a new programming language to kb's code indexing, from grammar to queryable facts?
answers:
  - >
    kb is a client/server knowledge system for turning git repositories into a queryable
    SQLite-backed knowledge base. **kb-server** owns indexing: configure git repos on the server
    (`KB_GIT_REPOS`, optional `KB_BASE`), run `kb-server start`, and the server clones, indexes code
    and docs, and re-indexes on a schedule. The **kb client** connects with `kb --host` or
    `KB_HOST` / `KB_PORT` / `KB_CONNECTION_STRING` and asks natural-language questions via `kb query` or
    interactive chat (`kb`). Bases are managed with `kb base`; repo membership and ignore patterns
    are declared on the server via `KB_SERVER_BASE_GIT_REPOS` and `KB_SERVER_IGNORE`. Supporting
    commands expose facts, documents, graph, publishing, and installed skills. The core user loop
    is: start/configure kb-server → connect the client → query or chat.

  - >
    Indexing runs inside **@kb/core** on kb-server (or in the eval harness via
    `scripts/eval-index.ts`). Bootstrap clones or registers git repo(s) into
    `~/.kb/sessions/<base>/repos/<slug>/` and runs checkpointed phases **per repo**:
    **read-inputs** discovers markdown and repo signals; **code-index** writes import_code facts
    and structural edges from AST indexers; **document-facts** segments markdown into deterministic
    import_doc facts; **import-docs** / **write** preserve original markdown in SQLite (scan also
    plans claim mutations in write). After the per-repo loop, **integration-ingest** reconciles
    cross-repo relationships (`depends_on_repo`, `cross_repo_symbol`, `references_repo`) so one base
    can connect facts across multiple git repos.

  - >
    A **scan** refreshes an existing base rather than creating one. It works over repos already
    tracked by the base, pulls or syncs them, detects changed source/code files via stored state
    such as content hashes in `code_file_state`, and re-runs the relevant indexing phases. Initial
    **bootstrap** (first-time build) clones repos and runs the full phase pipeline; routine
    **scan** / kb-server scheduled reindex (`KB_REINDEX_INTERVAL`) updates changed
    files and rebuilds cross-repo links. Operators change tracked repos by updating
    `KB_SERVER_BASE_GIT_REPOS` (or `KB_GIT_REPOS`) and restarting; kb-server picks up configured
    repos from the env on boot and folds in any newly-declared ones.

  - >
    Markdown fact ingest is deterministic (`packages/kb-core/src/core/scan-fact-ingest.ts`).
    **document-facts** reads markdown source files, strips OKF frontmatter when present, splits the
    body into sentence-like segments, and upserts each segment as an import_doc fact with a stable
    source reference such as `path.md#s0`. A doc's `resource:` field scopes which exported symbol
    each segment anchors to. This runs after code facts are available during indexing. Existing
    segment facts for a changed file are purged or tombstoned before re-ingest so removed text does
    not linger in retrieval.

  - >
    Code indexing is deterministic and does not depend on an LLM. Every language — including
    TypeScript/JavaScript — goes through a single `TreeSitterIndexer`
    (`packages/kb-core/src/tools/tree-sitter-indexer.ts`) that parses one file at a time with a
    WASM grammar (`web-tree-sitter`), so peak memory is bounded by the largest file rather than the
    whole project. It writes import_code facts for symbols, imports, and structural relationships
    (including constant-value and EXTENDS/IMPLEMENTS edges), and records a per-file content_hash in
    `code_file_state` to skip unchanged code on future scans. Languages without a wired WASM grammar
    are simply not indexed — there is no LLM fallback. The resulting code facts participate in
    graph edges and doc-fact anchoring.

  - |
    `kb query` (HTTP to kb-server in normal use) is facts-first: the server retrieves fact rows plus
    graph context, then asks the configured LLM to answer from that evidence. Retrieval blends
    several signals:

    - **Lexical** — SQLite FTS over the `facts` table.
    - **Semantic** — deterministic hash-based cosine scoring (a lexical proxy, not neural embeddings).
    - **Graph** — BFS neighbor expansion over `fact_edges`, with repo-aware ordering for multi-repo bases.
    - **Query expansion** — related terms drawn from graph and fact relationships before search.

    Deep discovery uses the facts-query research orchestrator (exploration ponds, sufficiency judge).
    Output reports retrieval method, facts considered, provenance ids, and the synthesized answer.

  - >
    kb skills are markdown skill documents loaded from **@kb/core** (`loadSkill`). The client
    installer (`kb skills install`, TUI `/skills install`) writes them into supported agent homes:
    Claude Code (`.claude/skills/<name>/SKILL.md`), Cursor (`.cursor/rules/<name>.mdc`),
    Codex (`.codex/skills/<name>.md`), and GitHub Copilot
    (`.github/copilot-instructions/<name>.md`). Installs embed a content hash
    (`<!-- kb-skill-hash:… -->`) so repeat runs skip unchanged files and update only when skill
    content changes. The bundled set is kb:dev-workflow.

  - |
    `pnpm run eval` invokes `scripts/eval-run.mjs` over a YAML suite. The run proceeds in stages:

    - **Resolve repo** — clone or locate the target repository named by the suite (default `repo_url`).
    - **Ensure base** — session name defaults to `eval-{suiteId}`; if empty, `scripts/eval-index.ts init`
      calls **@kb/core** directly from the kb checkout (not the cloned target's cwd).
    - **Refresh index** — every harvest runs `eval-index scan` (core scan) before queries.
    - **Ask questions** — pose each suite question with `kb query` and save per-question outputs.
    - **Auto-score** — optionally batch-grade via a judge model (Gemini via `GEMINI_API_KEY` or OpenAI
      fallback) on correctness, usefulness, relevance, specificity, and evidence handling.

    Artifacts land under `~/.kb/evaluations/<run>/` (artifact.json, auto-scores.json, telemetry,
    optional control comparison).

  - >
    Indexing runs on **kb-server** (or locally in the eval harness) — it clones/reads repos into
    `KB_HOME` and builds a local SQLite base (`.kb-index.sqlite`) on that host. Code indexing
    (tree-sitter AST) and markdown doc-fact ingest are deterministic with no LLM and no bulk upload
    of your source to a third party for indexing. The **kb client** sends natural-language questions
    (and chat context) to kb-server over HTTP; it does not ship your repository on each query.
    Outbound LLM calls happen at **query/chat synthesis** time (and optional judge/curator steps) —
    not as a remote "send us your repo" SaaS ingest. With no provider key, retrieval still works;
    only synthesized natural-language answers are unavailable.

  - >
    The deep facts-query retrieval loop defaults to a maximum of 24 passes, overridden by the
    `KB_FACTS_QUERY_MAX_ITERS` environment variable (clamped 1–24; `-1` lifts it toward the absolute
    safety cap of 512 passes). It is one of three deep-loop knobs: the others are
    `KB_FACTS_QUERY_MAX_HOPS` (graph hops, default 20) and `KB_FACTS_QUERY_MAX_PONDS` (exploration
    ponds, default 6). A correct answer must give the number 24 and the `KB_FACTS_QUERY_MAX_ITERS`
    variable specifically, not a vague "it is configurable."

  - >
    This is out of scope for kb. kb is a knowledge system — kb-server indexes repositories into a
    queryable SQLite knowledge base and the kb client queries or chats against that index; it also
    installs agent skills. It does not provision infrastructure, run deployments, or manage
    Kubernetes clusters. A correct answer should say so plainly rather than inventing a deploy
    workflow. The most kb could do is answer questions about Kubernetes manifests that already exist
    inside an indexed repository — it has no cluster-provisioning capability of its own.

  - >
    The fact curator runs only when the retrieved pool exceeds 12 facts
    (`DEFAULT_MIN_RESULTS_TO_CURATE`). Facts with high token overlap are auto-kept with no LLM call;
    the remainder go to a single structured judge verdict (`{keep, gaps, sufficient}`) keyed on the
    raw user question. Facts the judge does not keep are hard-dropped — there is no 15% floor. When the
    judge reports gaps and the set is not yet sufficient, the curator issues bounded shallow
    re-discovery queries (excluding what is already known) to refill those gaps. It fails safe to the
    unfiltered pool on any LLM/parse error and guards against ever returning an empty set. Curator
    decisions are recorded out-of-band on `retrieval.curation` and are not injected into the synthesis
    context.

  - >
    A kb query runs the shared `runQueryTruthRetrieval` path and answers facts-first, in order:
    (1) the query string is optionally graph-expanded (`expandQueryWithGraph`) to widen terms via
    `fact_edges`; (2) the **FactsQueryResearchOrchestrator** deep loop runs adaptive passes over
    exploration "ponds", each pass merging BFS edge-neighbors over `fact_edges`, lexical FTS, and
    concept-frontier rows, then scoring facts (doc facts weight text overlap; code facts weight
    graph proximity); (3) each iteration checks early exit — a heuristic (≥20 facts scoring ≥0.5),
    an LLM **sufficiency judge** every 3 iterations, or a plateau / frontier-exhausted stop; (4) it
    produces a ranked pool above `MIN_FACT_SCORE` (0.20); (5) when that pool exceeds 12 facts the
    **fact curator** runs — auto-keeping high-overlap facts, sending the rest to one structured
    verdict `{keep, gaps, sufficient}` keyed on the raw question, hard-dropping non-kept facts, and
    issuing bounded re-discovery to refill gaps; (6) surviving facts are formatted with
    `formatRetrievedFactsForLLM` (~2000 chars/fact); (7) `enrichReadDocumentsAnswerWithLLM` makes a
    single synthesis call to write the answer. Curator decisions are recorded out-of-band on
    `retrieval.curation` and never injected into synthesis. A correct answer should give the stages
    in order and note the >12-fact curator trigger and the one-shot synthesis.

  - >
    An interactive chat turn is handled by `runChatSynthesis` — a multi-turn loop whose only tool is
    `query_kb` — in order: (1) for synthesis/elaboration inputs (≥40 chars matching
    `SYNTHESIS_QUERY_RE`) a lightweight **decompose** pre-step splits the message into 1–4
    sub-queries that run in parallel and are injected as synthetic tool turns for grounding; (2) an
    **agentic while loop** calls the LLM with the `query_kb` tool, up to `MAX_CHAT_TURNS` (12); (3)
    when the model calls `query_kb` the query is graph-expanded and retrieved through the same
    `executeChatQueryTruthRetrieval` → `runQueryTruthRetrieval` path as `kb query` (deep orchestrator
    + fact curator), with all tool calls in a round run concurrently; (4) weak-evidence retrieval
    appends a retry hint telling the model to try different terms; (5) the loop breaks when the model
    returns no `tool_use` (or the cap is hit) and its final text is the answer. Each turn's retrieval
    is independent — no fact pool persists across turns; only prior question/answer prose persists in
    `messages[]`, so relevance is re-decided per query by the curator. A correct answer should cover
    decompose → agentic `query_kb` loop → shared retrieval/curation → final synthesis, and note that
    there is no cross-turn fact pool.

  - >
    kb code indexing is deterministic and runs every language through a single `TreeSitterIndexer`
    (`packages/kb-core/src/tools/tree-sitter-indexer.ts`) using `web-tree-sitter` WASM grammars —
    there is no LLM fallback. To add a language, end to end: (1) add the `tree-sitter-<lang>` npm
    package that ships a bundled `.wasm` grammar; (2) wire it into the language registry
    `LANG_CONFIGS`, giving its grammar require-spec via `resolveWasm('tree-sitter-<lang>',
    '<lang>.wasm')` (resolved at use-time, not eagerly at startup); (3) map the language's file
    extensions to that language key in `EXT_MAP` so code-index knows which files to parse; (4) ensure
    the grammar's AST nodes map to import_code facts (symbols, imports) and structural edges — the
    JS/TS family shares node-navigation, other grammars may need their node kinds handled; (5)
    rebuild and run `kb scan` (or `kb init`) so files of the new extension are parsed into facts and
    edges, with a per-file `content_hash` recorded in `code_file_state` to skip unchanged files
    later. A language without a wired grammar is simply not indexed. A correct answer should name the
    `LANG_CONFIGS` / `EXT_MAP` wiring and the rescan step, and note the deterministic no-LLM path.
