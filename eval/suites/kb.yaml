# kb repo / dogfood question pack. Use: --suite kb
schema_version: 1
id: kb
display_name: kb
repo_url: https://github.com/rosenjcb/kb.git
rubric_focus: the **kb** local-first knowledge CLI/repo
questions:
  - What is kb for, and what are the main commands and capabilities it provides?
  - How does kb init work, including the indexing phases and what gets written to the SQLite store?
  - How does kb scan differ from kb init, and when should a contributor use each?
  - How does retrieval work in kb query — including the hybrid search approach, graph involvement, and facts-first architecture?
  - How does the skills system work — how are skills defined, bundled during build, and installed into agent profiles?
  - Which AST indexers does kb use, what languages or file types does each handle, and how do they interact during code-index?
  - What does the query-expansion module do, how does it improve recall, and which parts of the codebase call into it?
  - How does the eval system work — what does npm run eval do, how is the session managed, and how are results scored?
answers:
  - >
    kb is a local-first knowledge base CLI that indexes a codebase into a SQLite-backed knowledge
    graph and answers natural-language questions about it using hybrid retrieval. It combines
    deterministic AST indexing (ts-morph for TS/JS, tree-sitter for Go/Python/Rust/etc.) with
    LLM-extracted doc facts stored in `.kb-index.sqlite`. A base tracks one or more git repos and
    folds them into a single graph. Main commands: `kb init --git <url>` (clone + index one or more
    git repos into a base), `kb scan` (pull + re-index the base's repos), `kb query`
    (natural-language Q&A via hybrid retrieval), `kb facts` (list/search facts), `kb docs`
    (inspect documents), `kb graph` (inspect/edit the knowledge graph), `kb publish` (publish to
    Notion or Jekyll, requires `--apply`), `kb submit` (add/update facts in a live base), `kb base`
    (manage sessions and their git repos: use, delete, repo add, repo remove, repo list).
    A React/Ink TUI launches when run in a TTY with slash-command
    autocomplete. Skills (kb:dev-workflow, kb:dump-context, kb:evaluation-run) install into Claude
    Code, Cursor, Codex, and Copilot agent profiles.

  - >
    `kb init` requires at least one `--git <url>` (repeatable; supports `url#branch`). It clones
    each repo into `~/.kb/sessions/<base>/repos/<slug>/` and runs 5 checkpointed cycles per repo:
    (1) read-inputs — discovers markdown sources and ingests integration signals (package.json
    deps, .env service refs); (2) code-index — runs TsMorphIndexer (TS/JS → IMPORTS_FILE,
    EXPORTS_SYMBOL, EXTENDS, IMPLEMENTS facts with source_kind='import_code') and TreeSitterIndexer
    (Go, Python, Rust, Ruby, Java, C, C++, C#, CSS, Bash, PHP, Scala, HTML etc.); (3) document-facts
    — sentence-segments markdown into the facts table; (4) import-docs — writes one is_original doc
    per markdown file into the documents table; (5) write — upserts documents. Every fact records
    its originating repo in a `git_repo` column. After all repos index, a reconciliation pass adds
    cross-repo `fact_edges` (depends_on_repo, cross_repo_symbol, references_repo) so the repos form
    one connected graph. SQLite tables written: facts (with git_repo), fact_edges, facts_fts (FTS5),
    fact_embeddings, documents, code_file_state. There is no category interview or fact_categories
    table — facts are organised by repo, not by user-named categories.

  - >
    `kb scan` pulls every git repo the base tracks and re-indexes the ones with changes, then
    rebuilds the cross-repo links. Unlike the old behavior, it does not read the current working
    directory — it operates on the base's cloned repos (under `~/.kb/sessions/<base>/repos/`).
    Re-indexing is incremental (only files whose content hash changed per code_file_state) and
    always applied. Use `kb init --git <url>` to create a base from one or more repos; use `kb scan`
    for routine refreshes; use `kb base repo add <url>` to fold an additional repo into an existing
    base (and `kb base repo remove` to drop one). Auto-sync runs the same per-repo refresh on
    session load and before queries.

  - >
    Retrieval is facts-first and multi-stage. First, `expandQueryWithGraph()` appends related terms:
    exported symbols found via FTS5 search + 1-hop fact_edges neighbors, plus subject/object
    LIKE-scan from the facts table — up to 26 extra terms. The facts-loop orchestrator then iterates
    over exploration ponds (query sub-topics). Each iteration combines lexical FTS5 search, graph
    neighbor expansion via fact_edges, and deterministic semantic scoring (cosine similarity between
    a query embedding and stored fact_embeddings, weighted at 35%). Final score = lexical overlap +
    semantic×0.35 + confidence + a repo-pool boost (facts from the landed repo rank highest, then
    sibling repos by distance along the cross-repo edge tree; single-repo bases get no boost).
    Retrieval is repo-scoped: it exhausts the repo the strongest hit lands in before walking the
    cross-repo edges to other repos. Iteration stops at answerable_plateau confidence or when
    all ponds are exhausted. The answer phase is multi-round: a quick intro first, then a
    retrieval-tool call for deep retrieval, then a final comprehensive answer. Reported as
    `hybrid (facts-loop;passes:N;ponds:N;semantic:on)`.

  - >
    Skills are markdown files in `skills/<name>/SKILL.md`. During build (scripts/build-cli.mjs)
    each SKILL.md is copied to `dist/bin/<name>.skill.md` alongside the bundled binary.
    At runtime, `src/skills/loader.ts` reads the skill: tries `<loaderDir>/<name>.skill.md`
    (prod/dist), falls back to `../../skills/<name>/SKILL.md` (dev/tsx). Three bundled skills:
    kb:dev-workflow, kb:dump-context, kb:evaluation-run. `src/cli/skill-installer.ts` installs
    each skill to four agent targets: Claude Code (~/.claude/skills/<name>/SKILL.md),
    Cursor (~/.cursor/rules/<name>.mdc), Codex (~/.codex/skills/<name>.md), and
    Copilot (~/.github/copilot-instructions/<name>.md). Installation is idempotent: a content hash
    is embedded as an HTML comment (`<!-- kb-skill-hash: ... -->`); the file is only rewritten if
    the hash changed.

  - >
    Two AST indexers run sequentially during the code-index cycle. TsMorphIndexer
    (src/tools/code-graph-indexer.ts) uses ts-morph for TypeScript and JavaScript, producing
    IMPORTS_FILE, EXPORTS_SYMBOL, EXTENDS, and IMPLEMENTS structural edge facts. TreeSitterIndexer
    (src/tools/tree-sitter-indexer.ts) uses web-tree-sitter with bundled WASM grammars and handles:
    Go, TypeScript, TSX, JavaScript, JSX, Python, Rust, Ruby, Java, C, C++, C# (.cs), CSS, Bash,
    PHP, Scala, and HTML, plus text-like formats (JSON, YAML, Markdown). Both indexers write to the
    facts table with source_kind='import_code'. Changed files are identified by content hash from
    code_file_state. Stale facts from deleted or changed files are tombstoned via
    tombstoneStaleAstFacts.

  - >
    `expandQueryWithGraph()` in src/tools/graph-query-expansion.ts appends related terms to the
    query before FTS search, improving recall by matching alternative names for the same concept.
    Two-pass expansion: (1) code graph pass — FTS-searches facts_fts for exported symbols matching
    tokenized query terms (including bigrams), then follows 1-hop fact_edges to get neighbor symbols
    (up to MAX_CODE_EXPANSION=8 terms); (2) facts LIKE-scan — for each query slug, scans the facts
    table subject/object for LIKE matches and appends the other side (up to MAX_SEMANTIC_EXPANSION=18
    terms). The expanded query string is passed to FTS search, causing it to match documents
    referencing related symbols even if the original term does not appear. Callers: src/cli/index.ts
    (kb query command), src/cli/chat-cli.ts (two chat-turn call sites), and
    src/tools/graph-rag-reranker.ts.

  - >
    `npm run eval` runs scripts/eval-run.mjs. Session management: derives base name as
    eval-{suiteId} (e.g. eval-kb), checks docs via `kb docs list --base <base>` parsing `Count: N`.
    If no docs, runs `kb init --base <base> --git <snapshot-clone>#<branch> --non-interactive`
    (the snapshot clone is the local git checkout); otherwise reuses the existing
    session. Query loop: runs all 8 questions from eval/suites/<suite>.yaml, saving each output as
    q1.json...q8.json (text format parsed by parseQueryText(), which extracts the final answer after
    the last `stage> answer` line before the `---` separator). Auto-scoring is on by default (opt
    out with --manual-score): runAutoScoreFile() sends all 8 Q&A pairs to Gemini
    (gemini-2.5-flash) or OpenAI, which scores 4 axes (Correctness, Usefulness, Specificity,
    Evidence Handling) each 0–4. Results saved to auto-scores.json and artifact.json under
    ~/.kb/evaluations/<run-name>/. Ends with a sparkline trends summary comparing this run against
    prior runs of the same suite.
