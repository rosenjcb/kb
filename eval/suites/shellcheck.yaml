# shellcheck repo / dogfood question pack. Use: --suite shellcheck
schema_version: 1
id: shellcheck
display_name: shellcheck
repo_url: https://github.com/koalaman/shellcheck.git
rubric_focus: ShellCheck static analysis tool and Haskell AST parsing engine
questions:
  - What are the three primary functional goals of ShellCheck when executing static analysis on shell scripts?
  - What are the core source files in the shellcheck codebase that implement parsing, syntax tree representation, and static analysis checks?
  - Why is ShellCheck support for Zsh syntax highly constrained compared to its comprehensive Bash parsing capabilities?
  - Detail the structural compilation process of ShellCheck from source utilizing the Cabal build utility.
  - Explain how variable flow tracing and modification detection are handled inside the analyzer libraries.
  - How are tests organized and executed inside the ShellCheck repository to verify parsing correctness?
  - How are specific rules bypassed or ignored within shell scripts evaluated by ShellCheck?
answers:
  - >
    ShellCheck is a static analysis tool designed to inspect shell scripts and provide linting reports.
    Its analytical goals are: (1) to identify and clarify typical beginner-level syntax issues that
    cause shells to emit cryptic errors; (2) to isolate and explain intermediate-level semantic bugs
    where scripts exhibit unexpected or counter-intuitive execution behavior; and (3) to point out
    subtle edge cases, portability issues, and safety pitfalls that may cause an advanced user's script
    to fail under future operating circumstances.
  - >
    The ShellCheck source architecture is built around key Haskell modules in the src/ directory:
    Parser.hs handles lexical tokenization and syntactic parsing of raw shell script lines into tokens;
    AST.hs defines the algebraic data types and structured nodes representing the abstract syntax tree
    of the script; and Analytics.hs (along with specific modules in the Checks/ directory) implements
    the core analysis engines and linting rules that walk the AST to flag violations and issue warnings.
  - >
    ShellCheck focuses on POSIX-compliant shells, Bash, and ksh because they share cohesive syntax structures.
    Supporting Zsh syntax is structurally difficult as Zsh introduces a highly custom, unique grammar
    that does not align with standard Bash AST definitions. Implementing Zsh parsing would require writing
    extensive custom monadic parsing rules in Parser.hs to avoid parsing errors, and extending variable-tracing
    engines like AnalyzerLib.hs to handle Zsh's distinct array patterns and word-splitting behaviors.
  - >
    To compile ShellCheck from source, the system must have a functional GHC Haskell compiler and at least
    2GB of RAM. The process relies on the Cabal packaging utility: first, running 'cabal update' synchronizes
    the system's local package indexes; then, executing 'cabal install' inside the shellcheck root directory
    triggers the compiler to parse dependencies, build the core Haskell modules, generate the executable
    target, and install the compiled binary to the user's local path at ~/.cabal/bin/.
  - >
    Variable flow tracing is handled inside src/AnalyzerLib.hs. The analyzer performs lexical scope tracking
    and constant propagation by traversing the AST nodes. It monitors assignment commands (like x=value,
    read x, or local x), records when variables are declared, tracking whether they are ever modified,
    re-assigned, or left unused. This data is preserved inside analyzer maps, allowing checks to flag errors
    like read-only variable modifications, uninitialized variable references, or dead assignments.
  - >
    Tests are managed within Haskell test suites in the test/ and src/ folders, including specific checks inside
    Checks/*.hs and Analytics.hs. Tests use inline assertions that execute shellcheck against short code snippets.
    These tests declare a specific shell target, execute the parser and analyzer over the sample, and assert
    that target error codes (like SC2002 or SC2154) are either triggered or correctly suppressed based on the
    checked AST rules.
  - >
    Users can bypass or ignore specific rules within evaluated shell scripts by inserting inline comment annotations
    preceded by 'shellcheck disable=SCxxxx'. The parser inside Parser.hs reads these comment strings adjacent to AST
    nodes, associates the suppression metadata with the target node block, and filters out the matching error codes during
    the analysis pass in Analytics.hs.
