# Vendor question pack for `kb` eval harness. Use: --suite raylib
# Schema: eval/suites/README.md (or see loadVendorSuite in scripts/eval-run.mjs)
schema_version: 1
id: raylib
display_name: raylib
repo_url: https://github.com/raysan5/raylib.git
rubric_focus: the **raylib** C library knowledge base (facts + docs in SQLite)
questions:
  - What is raylib for, and what are its main capabilities?
  - How does raylib's architecture work, including modules and platform support?
  - How do I install and build raylib, including dependencies and build systems?
  - Which source files in src/ implement platform-specific backends, and how do they relate to rcore?
  - What functions does rcore.c expose that are called by or depended on by other source files?
  - What are the coding conventions and style guidelines for contributing to raylib?
  - What are the main gotchas, constraints, and known limitations of raylib?
  - Which header files does raylib.h directly include, and what subsystems do those dependencies cover?
  - Step by step, what happens inside InitWindow() to open a window and set up the graphics context?
  - Trace raylib's standard render loop in order — what do BeginDrawing, the drawing calls, and EndDrawing each do, and in what sequence?
  - How do I add a new example program to raylib and get it built, step by step?
